  // --------------------------------------------------------------- drills

  // Rotate through the bank so repeat sessions are not the same five boards.
  function pickDrills(id, n, offset) {
    const bank = DATA.drills[id];
    const start = (offset || techStat(id).seen || 0) % bank.length;
    const out = [];
    for (let i = 0; i < n; i++) out.push(bank[(start + i) % bank.length]);
    return out;
  }

  let session = null;

  routes.drill = function (id) {
    session = {
      kind: 'drill', tech: id, list: pickDrills(id, 5), i: 0,
      right: 0, firstTry: 0, tries: 0, hint: 0, started: Date.now()
    };
    renderDrill();
  };

  // Mixed practice: the question is which technique applies, not just where.
  routes.spotcheck = function () {
    const pool = learnedTechs();
    if (pool.length < 3) {
      const w = screen('Spot Check', 'home');
      const c = el('div', 'card');
      c.style.textAlign = 'center';
      c.innerHTML = `<div style="font-size:38px">🎓</div>
        <div style="font-weight:800;font-size:19px;margin-top:6px">The final boss unlocks later</div>
        <div class="muted" style="margin-top:8px;font-size:15px">Spot Check hands you a board with <b>no labels</b> and asks which technique cracks it. That only works once you know a few! Learn any 3 techniques on the ladder and this opens up.</div>`;
      w.appendChild(c);
      const next = TECHS.find(t => !P.lessons[t.id]);
      const b = el('button', 'btn primary', next ? `Start with ${next.name} &rarr;` : 'To the ladder');
      b.style.marginTop = '12px';
      b.addEventListener('click', () => go(next ? 'lesson:' + next.id : 'home'));
      w.appendChild(b);
      return;
    }
    const from = pool.map(t => t.id);
    const list = [];
    for (let i = 0; i < 6; i++) {
      const id = from[(Math.random() * from.length) | 0];
      const bank = DATA.drills[id];
      list.push(bank[(Math.random() * bank.length) | 0]);
    }
    session = { kind: 'spot', list, i: 0, right: 0, firstTry: 0, tries: 0, hint: 0, started: Date.now(), identify: true };
    renderDrill();
  };

  function renderDrill() {
    const s = session;
    if (s.i >= s.list.length) return renderSummary();
    const d = s.list[s.i];
    const lesson = LESSONS[d.t];
    const spec = SPEC[d.t];
    const st = drillState(d);
    const title = s.kind === 'vs' ? s.names[s.i % 2] + "'s turn"
      : s.kind === 'daily' ? 'Daily'
      : s.kind === 'spot' ? 'Spot Check' : lesson.name;
    const w = screen(`${title} ${s.i + 1}/${s.list.length}`, s.kind === 'spot' ? 'home' : 'lesson:' + d.t);

    // In identify mode the player names the technique before locating it.
    if (s.identify && !s.identified) return renderIdentify(w, d, st);

    const selCells = s.selCells || (s.selCells = new Set());
    const selDigits = s.selDigits || (s.selDigits = new Set());

    // Notes clutter the board, so they only show when the technique is ABOUT
    // notes. Singles drills whose position is derivable from the raw board
    // (d.basic) start clean, exactly like a real phone game mid-swipe.
    if (s.showNotes === undefined) s.showNotes = !(LESSONS[d.t].tier === 1 && d.basic);

    const prompt = el('div', 'prompt');
    const range = spec.cells[0] === spec.cells[1] ? spec.cells[0] : `${spec.cells[0]}-${spec.cells[1]}`;
    prompt.innerHTML = `<div class="q">${lesson.icon} Find the ${esc(lesson.name)}</div>
      <div class="s">${esc(spec.ask)}</div>
      <div class="chipline">
        <span class="chip">need <b>${range}</b> ${spec.word}</span>
        <span class="chip">need <b>${spec.digits}</b> digit${spec.digits > 1 ? 's' : ''}</span>
        <span class="chip">picked <b>${selCells.size}</b> / <b>${selDigits.size}</b></span>
      </div>`;
    const nt = el('button', 'chip', s.showNotes ? '✏️ notes on' : '✏️ notes off');
    prompt.querySelector('.chipline').appendChild(nt);
    nt.addEventListener('click', () => { s.showNotes = !s.showNotes; renderDrill(); });
    w.appendChild(prompt);

    const bw = el('div', 'boardwrap');
    const revealed = s.revealed;
    // Once the answer is on the table, always show the notes it lives in.
    const showNotes = s.showNotes || !!revealed;
    let sameSet = null;
    if (s.hiSame) {
      sameSet = new Set();
      for (let i = 0; i < 81; i++) if (st.grid[i] === s.hiSame) sameSet.add(i);
    }
    bw.appendChild(renderBoard({
      grid: st.grid, cands: st.cands, given: d.g, showNotes,
      sel: selCells, sameDigit: sameSet, hiNote: s.hiSame || 0,
      pending: (spec.cells[1] === 1 && selCells.size === 1 && selDigits.size === 1 && !s.done)
        ? { cell: selCells.values().next().value, digit: selDigits.values().next().value } : null,
      pattern: revealed ? new Set(revealed.cells) : null,
      units: revealed ? revealed.units : (s.hintUnits || null),
      elim: revealed ? revealed.elim : null,
      blockers: revealed ? revealed.extra : null,
      hiDigits: [...selDigits],
      onTap: c => {
        if (s.done) return;
        // Tapping a placed number lights up all its copies, exactly like the
        // phone apps. It makes swiping the drill board feel natural.
        buzz(6);
        if (st.grid[c]) {
          s.hiSame = (s.hiSame === st.grid[c]) ? null : st.grid[c];
          renderDrill();
          return;
        }
        selCells.has(c) ? selCells.delete(c) : selCells.add(c);
        // Selection MOVES instead of piling up: past the technique's needs,
        // the oldest pick drops off, exactly like single-select in the apps.
        while (selCells.size > spec.cells[1]) selCells.delete(selCells.values().next().value);
        renderDrill();
      }
    }));
    w.appendChild(bw);

    const pad = el('div', 'pad');
    for (let dg = 1; dg <= 9; dg++) {
      const b = el('button', selDigits.has(dg) ? 'on' : '');
      b.innerHTML = dg;
      b.addEventListener('click', () => {
        if (s.done) return;
        buzz(6);
        selDigits.has(dg) ? selDigits.delete(dg) : selDigits.add(dg);
        while (selDigits.size > spec.digits) selDigits.delete(selDigits.values().next().value);
        renderDrill();
      });
      pad.appendChild(b);
    }
    w.appendChild(pad);

    if (s.feedback) {
      const f = el('div', 'fb ' + s.feedback.cls);
      f.innerHTML = `<div class="h">${s.feedback.head}</div>${s.feedback.body}`;
      w.appendChild(f);
    }
    if (s.hint > 0 && !s.done) {
      const hs = hints(d, d.m);
      const hb = el('div', 'hintbox');
      hb.innerHTML = hs.slice(0, s.hint).map((h, i) => `<div style="margin-bottom:5px">Hint ${i + 1}: ${h}</div>`).join('');
      w.appendChild(hb);
    }

    const row = el('div', 'btnrow');
    if (s.done) {
      const nx = el('button', 'btn primary', s.i === s.list.length - 1 ? 'See results' : 'Next drill &rarr;');
      nx.addEventListener('click', nextDrill);
      row.appendChild(nx);
    } else {
      const hb = el('button', 'btn ghost', s.hint >= 3 ? 'No hints left' : `💡 Hint (${s.hint}/3)`);
      if (s.hint >= 3) hb.disabled = true;
      hb.addEventListener('click', () => {
        s.hint++;
        if (s.hint === 2) s.hintUnits = d.m.units;
        renderDrill();
      });
      const ck = el('button', 'btn primary', 'Check');
      ck.addEventListener('click', () => doCheck(d));
      row.appendChild(hb); row.appendChild(ck);
    }
    w.appendChild(row);

    if (!s.done) {
      const giveUp = el('button', 'btn ghost', 'Show me the answer');
      giveUp.style.marginTop = '9px';
      giveUp.style.fontSize = '13.5px';
      giveUp.addEventListener('click', () => reveal(d, d.m, false));
      w.appendChild(giveUp);
    }
  }

  function renderIdentify(w, d, st) {
    const s = session;
    const prompt = el('div', 'prompt');
    prompt.innerHTML = `<div class="q">🎯 Which technique cracks this?</div>
      <div class="s">Nothing simpler works on this board. Read the position, then pick the cheapest technique that applies. Tap a placed number to light up its copies.</div>`;
    w.appendChild(prompt);

    let sameSet = null;
    if (s.hiSame) {
      sameSet = new Set();
      for (let i = 0; i < 81; i++) if (st.grid[i] === s.hiSame) sameSet.add(i);
    }
    const bw = el('div', 'boardwrap');
    bw.appendChild(renderBoard({
      grid: st.grid, cands: st.cands, given: d.g, showNotes: true,
      sameDigit: sameSet, hiNote: s.hiSame || 0,
      onTap: c => {
        if (st.grid[c]) { s.hiSame = (s.hiSame === st.grid[c]) ? null : st.grid[c]; buzz(6); renderDrill(); }
      }
    }));
    w.appendChild(bw);

    // The verdict sits ABOVE the options so a wrong guess is explained right
    // where the player is looking, not below the fold.
    if (s.feedback) {
      const f = el('div', 'fb ' + s.feedback.cls);
      f.innerHTML = `<div class="h">${s.feedback.head}</div>${s.feedback.body}`;
      f.style.marginBottom = '12px';
      w.appendChild(f);
    }

    // Only offer techniques they have actually met (padded to at least four),
    // so the question is a quiz on known material, not a guessing game.
    const opts = learnedTechs().slice();
    if (!opts.some(t => t.id === d.t)) opts.push(TECHS.find(t => t.id === d.t));
    for (const t of TECHS) {
      if (opts.length >= 4) break;
      if (!opts.includes(t)) opts.push(t);
    }
    opts.sort((a, b) => a.tier - b.tier);

    for (const t of opts) {
      const b = el('button', 'trow');
      b.innerHTML = `<div class="body"><div class="nm">${LESSONS[t.id].icon} ${esc(t.name)}</div>
        <div class="sb">${esc(LESSONS[t.id].alias)}</div></div><div class="chev">&#8250;</div>`;
      b.addEventListener('click', () => {
        if (t.id === d.t) {
          s.identified = true;
          buzz([12, 40, 18]);
          s.feedback = { cls: 'ok', head: 'Correct! 🎯', body: `It is a ${esc(t.name)}. Now find it on the board.` };
          renderDrill();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          s.tries++;
          buzz(35);
          const guessTier = t.tier, realTier = LESSONS[d.t].tier;
          s.feedback = {
            cls: 'no', head: 'Not that one 🙅',
            body: (guessTier < realTier
              ? `There is no ${esc(t.name)} available here. When the cheap techniques are dry, move <em>up</em> the ladder.`
              : `${esc(t.name)} is heavier than this position needs. Always take the cheapest technique that works, and check the easy ones first.`)
              + `<br><br><span class="dim">What a ${esc(t.name)} looks like: ${esc(LESSONS[t.id].tell)}</span>`
          };
          renderDrill();
          const f = $('.fb');
          if (f) f.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }
      });
      w.appendChild(b);
    }
  }

  function doCheck(d) {
    const s = session;
    const res = grade(d, s.selCells, s.selDigits);
    if (res.ok) return reveal(d, res.move, true);
    s.tries++;
    buzz(35);
    s.feedback = {
      cls: res.kind === 'partial' ? 'warn' : 'no',
      head: res.kind === 'partial' ? 'Sooo close 👀' : 'Not yet 🤔',
      body: res.msg
    };
    renderDrill();
    const f = $('.fb');
    if (f) f.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  function reveal(d, move, correct) {
    const s = session;
    s.done = true;
    s.revealed = move;
    const st = techStat(d.t);
    st.seen++;
    const clean = correct && s.tries === 0 && s.hint === 0;
    s.marks = s.marks || [];
    s.marks.push(correct ? (clean ? 2 : 1) : 0);
    if (s.kind === 'vs') s.scores[s.i % 2] += clean ? 2 : (correct ? 1 : 0);
    if (correct) {
      s.right++;
      st.right++;
      P.total = (P.total || 0) + 1;
      if (clean) { s.firstTry++; st.firstTry++; st.streak++; st.best = Math.max(st.best || 0, st.streak); }
      s.feedback = {
        cls: 'ok',
        head: clean ? 'Clean spot! 🎉' : 'Got it ✅',
        body: `${move.note}<br><br><span class="dim">${move.place && move.place.length
          ? 'Places ' + move.place.map(p => `<b>${p[1]}</b> in ${S.cellName(p[0])}`).join(', ') + '.'
          : 'Removes ' + plural(move.elim.length, 'candidate') + ': ' + move.elim.map(e => `${e[1]} from ${S.cellName(e[0])}`).join(', ') + '.'}</span>`
      };
    } else {
      st.streak = 0;
      s.feedback = {
        cls: 'warn', head: 'Here it is 👇',
        body: `${move.note}<br><br><span class="dim">Pattern: ${S.cellNames(move.cells)}. Look at the shape, not the position, that is what transfers to the next board.</span>`
      };
    }
    save();
    buzz(correct ? [12, 40, 18] : 40);
    renderDrill();
    const f = $('.fb');
    if (f) f.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  function nextDrill() {
    const s = session;
    s.i++;
    s.selCells = new Set(); s.selDigits = new Set();
    s.done = false; s.feedback = null; s.revealed = null; s.hint = 0; s.tries = 0;
    s.hintUnits = null; s.identified = false; s.showNotes = undefined; s.hiSame = null;
    renderDrill();
  }

  function renderSummary() {
    const s = session;
    const secs = Math.round((Date.now() - s.started) / 1000);

    if (s.kind === 'daily') {
      P.daily[s.day] = { right: s.right, n: s.list.length, clean: s.firstTry, secs, marks: s.marks || [] };
      save();
      return routes.daily();
    }

    if (s.kind === 'vs') {
      const w = screen('Final score', 'home');
      const win = s.scores[0] === s.scores[1] ? null : (s.scores[0] > s.scores[1] ? 0 : 1);
      const head = el('div', 'card confetti');
      head.style.textAlign = 'center';
      head.innerHTML = `<div style="font-size:40px">${win == null ? '\u{1F91D}' : '\u{1F3C6}'}</div>
        <div style="font-size:22px;font-weight:800;margin-top:6px">${win == null ? 'Dead heat' : esc(s.names[win]) + ' takes it'}</div>
        <div class="dim" style="margin-top:8px">2 points for a clean spot, 1 with hints.</div>`;
      w.appendChild(head);
      const c = el('div', 'card');
      c.innerHTML = `<div class="scoreline"><span>${esc(s.names[0])}</span><span class="v">${s.scores[0]}</span></div>
        <div class="scoreline"><span>${esc(s.names[1])}</span><span class="v">${s.scores[1]}</span></div>`;
      w.appendChild(c);
      const again = el('button', 'btn primary', 'Rematch');
      again.addEventListener('click', () => go('versus'));
      w.appendChild(again);
      const home = el('button', 'btn ghost', 'Back to the ladder');
      home.style.marginTop = '9px';
      home.addEventListener('click', () => go('home'));
      w.appendChild(home);
      return;
    }

    const w = screen('Session complete', 'home');
    const pct = Math.round(100 * s.right / s.list.length);
    const head = el('div', 'card confetti');
    head.style.textAlign = 'center';
    head.innerHTML = `<div style="font-size:40px">${pct === 100 ? '\u{1F3C6}' : pct >= 60 ? '\u{1F44F}' : '\u{1F4AA}'}</div>
      <div style="font-size:26px;font-weight:800;margin-top:6px">${s.right} / ${s.list.length}</div>
      <div class="dim">${s.firstTry} clean, no hints &middot; ${Math.floor(secs / 60)}m ${secs % 60}s</div>`;
    w.appendChild(head);

    if (s.tech) {
      const st = techStat(s.tech);
      const c = el('div', 'card');
      c.innerHTML = `<div class="scoreline"><span>Clean spots, all time</span><span class="v">${st.firstTry} / ${MASTER_AT}</span></div>
        <div class="scoreline"><span>Best clean streak</span><span class="v">${st.best || 0}</span></div>
        <div class="scoreline"><span>Status</span><span class="v">${isMastered(s.tech) ? 'Mastered \u2605' : 'Learning'}</span></div>`;
      w.appendChild(c);
      if (!isMastered(s.tech)) {
        const again = el('button', 'btn primary', 'Five more');
        again.addEventListener('click', () => go('drill:' + s.tech));
        w.appendChild(again);
      }
      const nextT = TECHS.find(t => !isMastered(t.id) && t.id !== s.tech);
      if (nextT) {
        const nb = el('button', 'btn', `Next up: ${nextT.name} &rarr;`);
        nb.style.marginTop = '9px';
        nb.addEventListener('click', () => go('lesson:' + nextT.id));
        w.appendChild(nb);
      }
    } else {
      const again = el('button', 'btn primary', 'Another six');
      again.addEventListener('click', () => go('spotcheck'));
      w.appendChild(again);
    }
    const home = el('button', 'btn ghost', 'Back to the ladder');
    home.style.marginTop = '9px';
    home.addEventListener('click', () => go('home'));
    w.appendChild(home);
  }

  // ------------------------------------------------------------- free play

  routes.playpick = function () {
    const w = screen('Free Play', 'home');
    w.appendChild(el('div', 'callout', 'Full puzzles with the trainer attached. Stuck? <b>Nudge</b> tells you which technique is available and walks you in, instead of just handing you a digit.'));
    const order = ['gentle', 'easy', 'medium', 'hard', 'expert', 'brutal'];
    const blurb = {
      gentle: 'Extremely easy. Most of the board arrives pre-filled, just cruise. 🛋️',
      easy: 'Singles all the way, with room to breathe.',
      medium: 'Pointing pairs and box-line.', hard: 'Triples in the mix.',
      expert: 'An X-Wing in there somewhere.', brutal: 'XY-Wing or Swordfish required.'
    };
    for (const d of order) {
      const n = DATA.puzzles.filter(p => p.d === d).length;
      if (!n) continue;
      const b = el('button', 'trow');
      b.innerHTML = `<div class="body"><div class="nm">${esc(d[0].toUpperCase() + d.slice(1))}</div>
        <div class="sb">${esc(blurb[d] || '')}</div></div>
        <span class="pill">${n}</span><div class="chev">&#8250;</div>`;
      b.addEventListener('click', () => go('play:' + d));
      w.appendChild(b);
    }
  };

  let game = null;

  const encodeC = cands => Array.from(cands).map(m => m.toString(32).padStart(2, '0')).join('');

  // The in-progress puzzle survives closing the app, exactly like the phone
  // games do. Saved on every change, cleared on solve.
  function savePlay() {
    const g = game;
    if (!g || !g.puz) return;
    if (!g.grid.includes(0)) {
      if (P.play) { delete P.play; save(); }
      return;
    }
    P.play = {
      p: g.given, s: g.puz.s, d: g.diff,
      grid: S.toStr(g.grid), cands: encodeC(g.cands),
      notes: g.notes, elapsed: Date.now() - g.started, mistakes: g.mistakes
    };
    save();
  }

  // ------------------------------------------------------- solve my board

  // Type in the board you are stuck on (Easy Brain, Tesla, newspaper), then
  // get coached through it: cheapest next move, which technique, why it works.
  let entryGrid = null;
  let pendingCoach = null;

  routes.entry = function () {
    if (!entryGrid) entryGrid = { grid: new Int8Array(81), cursor: null };
    const e2 = entryGrid;
    const w = screen('Solve My Board', 'home');

    const clues = Array.from(e2.grid).filter(Boolean).length;
    const prompt = el('div', 'prompt');
    prompt.innerHTML = `<div class="q">🚗 Copy your board in</div>
      <div class="s">Tap a cell, tap its number. Every filled square from your game, including your own entries. Then I coach you through what is next.</div>
      <div class="chipline"><span class="chip"><b>${clues}</b> numbers in</span>
      <span class="chip">need about <b>25+</b> to coach well</span></div>`;
    w.appendChild(prompt);

    const conflicts = new Set();
    for (let c = 0; c < 81; c++) {
      const v = e2.grid[c];
      if (!v) continue;
      for (const pr of S.PEERS[c]) if (e2.grid[pr] === v) { conflicts.add(c); conflicts.add(pr); }
    }

    const bw = el('div', 'boardwrap');
    bw.appendChild(renderBoard({
      grid: e2.grid, given: '.'.repeat(81), showNotes: false,
      cursor: e2.cursor, conflicts,
      peers: e2.cursor != null ? new Set(S.PEERS[e2.cursor]) : null,
      onTap: c => { buzz(6); e2.cursor = (e2.cursor === c ? null : c); routes.entry(); }
    }));
    w.appendChild(bw);

    const pad = el('div', 'pad');
    for (let dg = 1; dg <= 9; dg++) {
      const b = el('button', '');
      b.innerHTML = dg;
      b.addEventListener('click', () => {
        if (e2.cursor == null) return toast('Pick a cell first.');
        buzz(6);
        e2.grid[e2.cursor] = (e2.grid[e2.cursor] === dg) ? 0 : dg;
        routes.entry();
      });
      pad.appendChild(b);
    }
    w.appendChild(pad);

    const tools = el('div', 'toolrow');
    tools.appendChild(tool('⌫', 'Erase', false, () => {
      if (e2.cursor == null) return toast('Pick a cell first.');
      e2.grid[e2.cursor] = 0; routes.entry();
    }));
    tools.appendChild(tool('🗑️', 'Clear all', false, () => {
      if (confirm('Wipe the whole entry?')) { e2.grid = new Int8Array(81); routes.entry(); }
    }));
    w.appendChild(tools);

    const goBtn = el('button', 'btn primary', 'Start coaching &rarr;');
    goBtn.addEventListener('click', () => {
      if (conflicts.size) return toast('Two matching numbers share a line or box, fix the red ones first.');
      if (clues < 17) return toast('That is not enough numbers yet, keep copying.');
      const sol = S.solve(e2.grid);
      if (!sol) return toast('This board has no solution, one of the numbers must be off.');
      pendingCoach = { p: S.toStr(e2.grid), s: S.toStr(sol), d: 'coach' };
      go('play:coach');
    });
    w.appendChild(goBtn);
  };

  routes.play = function (arg) {
    if (arg === 'coach') {
      if (!pendingCoach) return go('entry');
      const puz = pendingCoach;
      pendingCoach = null;
      entryGrid = null;
      const g0 = S.parse(puz.p);
      window.__lastPuzzleSolution = puz.s;
      game = {
        puz, given: puz.p, grid: g0, cands: S.computeCands(g0),
        notes: false, undo: [], hint: 0, hintMove: null, cursor: null,
        started: Date.now(), diff: 'coach', mistakes: 0, coach: true
      };
      renderPlay();
      return;
    }
    if (arg === 'resume') {
      const r = P.play;
      if (!r || !r.grid) return go('playpick');
      window.__lastPuzzleSolution = r.s;
      game = {
        puz: { p: r.p, s: r.s, d: r.d }, given: r.p, grid: S.parse(r.grid),
        cands: decodeCands(r.cands), notes: !!r.notes, undo: [], hint: 0,
        hintMove: null, cursor: null, started: Date.now() - (r.elapsed || 0),
        diff: r.d, mistakes: r.mistakes || 0, coach: r.d === 'coach'
      };
      renderPlay();
      return;
    }
    const parts = String(arg).split('|');
    const diff = parts[0];
    let puz;
    if (diff === 'seed') {
      const bank = DATA.puzzles;
      puz = bank[hashStr(parts[1]) % bank.length];
    } else {
      const bank = DATA.puzzles.filter(p => p.d === diff);
      puz = bank[(Math.random() * bank.length) | 0];
    }
    window.__lastPuzzleSolution = puz.s;   // read by the offline UI test harness
    game = {
      puz, given: puz.p, grid: S.parse(puz.p), cands: new Int16Array(81),
      notes: false, undo: [], hint: 0, hintMove: null, cursor: null,
      started: Date.now(), diff, mistakes: 0
    };
    renderPlay();
  };

  function hashStr(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return Math.abs(h);
  }

  function playState() { return { grid: game.grid, cands: S.computeCands(game.grid) }; }

  function conflictSet() {
    const bad = new Set();
    for (let c = 0; c < 81; c++) {
      const v = game.grid[c];
      if (!v) continue;
      for (const p of S.PEERS[c]) if (game.grid[p] === v) { bad.add(c); bad.add(p); }
    }
    return bad;
  }

  function renderPlay() {
    const g = game;
    savePlay();
    const w = screen(g.coach ? 'Coach mode 🚗' : g.diff === 'seed' ? 'Daily puzzle' : g.diff[0].toUpperCase() + g.diff.slice(1), 'home');
    const filled = Array.from(g.grid).filter(Boolean).length;
    const secs = Math.round((Date.now() - g.started) / 1000);

    const bar = el('div', 'chipline');
    bar.style.marginBottom = '8px';
    bar.innerHTML = `<span class="chip">${filled}/81 filled</span>
      <span class="chip">${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}</span>
      <span class="chip">${plural(g.mistakes, 'slip')}</span>`;
    w.appendChild(bar);

    const conflicts = conflictSet();
    for (const c of (g.slip || [])) conflicts.add(c);
    const cur = g.cursor;
    const peers = cur != null ? new Set(S.PEERS[cur]) : null;
    const sameDigit = new Set();
    if (cur != null && g.grid[cur]) for (let c = 0; c < 81; c++) if (g.grid[c] === g.grid[cur]) sameDigit.add(c);

    const hm = g.hintMove;
    const bw = el('div', 'boardwrap');
    bw.appendChild(renderBoard({
      grid: g.grid, cands: g.cands, given: g.given, showNotes: true,
      cursor: cur, peers, sameDigit, conflicts,
      hiNote: (cur != null && g.grid[cur]) ? g.grid[cur] : 0,
      pattern: (hm && g.hint >= 3) ? new Set(hm.cells) : null,
      units: (hm && g.hint >= 2) ? hm.units : null,
      elim: (hm && g.hint >= 3) ? hm.eliminations.map(e => [e.cell, e.digit]) : null,
      hiDigits: (hm && g.hint >= 1) ? hm.digits : null,
      onTap: c => { buzz(6); g.cursor = (g.cursor === c ? null : c); g.hintMove = null; g.hint = 0; renderPlay(); }
    }));
    w.appendChild(bw);

    const pad = el('div', 'pad');
    for (let dg = 1; dg <= 9; dg++) {
      const left = 9 - Array.from(g.grid).filter(v => v === dg).length;
      const b = el('button', left <= 0 ? 'gone' : '');
      b.innerHTML = `${dg}<em>${left > 0 ? left : ''}</em>`;
      b.addEventListener('click', () => enter(dg));
      pad.appendChild(b);
    }
    w.appendChild(pad);

    // Toolbar mirrors the Easy Brain app: Undo, Erase, Notes with a visible
    // ON/OFF state, then our extras (auto-notes and a real teaching Hint).
    const tools = el('div', 'toolrow');
    tools.appendChild(tool('↩️', 'Undo', false, () => {
      const u = g.undo.pop();
      if (!u) return toast('Nothing to undo.');
      g.grid = u.grid; g.cands = u.cands; renderPlay();
    }));
    tools.appendChild(tool('⌫', 'Erase', false, () => {
      if (g.cursor == null) return toast('Pick a cell first.');
      if (g.given[g.cursor] !== '.') return toast('That is a clue, it stays.');
      pushUndo(); g.grid[g.cursor] = 0; g.cands[g.cursor] = 0; renderPlay();
    }));
    tools.appendChild(tool('✏️', g.notes ? 'Notes ON' : 'Notes OFF', g.notes,
      () => { g.notes = !g.notes; buzz(6); renderPlay(); }));
    tools.appendChild(tool('🪄', 'Auto notes', false, () => {
      pushUndo();
      g.cands = S.computeCands(g.grid);
      toast('Notes filled and cleaned. ✨');
      renderPlay();
    }));
    tools.appendChild(tool('💡', g.hint ? `Hint ${g.hint}/3` : 'Hint', !!g.hintMove, doNudge));
    w.appendChild(tools);

    if (g.coach && filled < 81) {
      const nm2 = el('button', 'btn primary', g.hint === 0 ? '🧑‍🏫 Next move'
        : g.hint < 3 ? `🧑‍🏫 Next move · more detail (${g.hint}/3)` : '🧑‍🏫 Next move · full walkthrough below');
      nm2.addEventListener('click', doNudge);
      w.appendChild(nm2);
    }

    if (g.slip && g.slip.length) {
      const box = el('div', 'fb no');
      box.innerHTML = `<div class="h">Before a hint can help: ${plural(g.slip.length, 'wrong digit')}</div>
        ${g.slip.map(c => `<b>${S.cellName(c)}</b>`).join(', ')} ${g.slip.length === 1 ? 'does' : 'do'} not belong there.
        Every technique reads the board as truth, so one wrong digit poisons everything after it.
        Undo or erase, then nudge again.`;
      w.appendChild(box);
    }

    if (g.hintMove) {
      const m = g.hintMove;
      const box = el('div', 'hintbox');
      const lines = [];
      lines.push(`<b>${esc(m.name)}</b> is the cheapest move on the board. ${g.hint >= 2 ? 'Digit: <b>' + m.digits.join(', ') + '</b>.' : 'Try to spot it first, or tap Hint again.'}`);
      if (g.hint >= 2 && m.units.length) lines.push(`Look at <b>${[...new Set(m.units)].map(S.unitName).slice(0, 3).join(', ')}</b>.`);
      if (g.hint >= 3) lines.push(m.note);
      if (g.hint >= 3) {
        lines.push(`<span class="dim">How to spot one yourself: ${LESSONS[m.id] ? esc(LESSONS[m.id].tell) : ''}</span>`);
      }
      if (g.coach && LESSONS[m.id]) {
        lines.push(`<span class="dim">Why it works: ${esc(LESSONS[m.id].tagline)}</span>`);
        lines.push(`<a href="#lesson:${m.id}">📖 Learn ${esc(m.name)} properly</a>`);
      }
      box.innerHTML = lines.map(x => `<div style="margin-bottom:6px">${x}</div>`).join('');
      w.appendChild(box);
      if (g.hint >= 3) {
        const ap = el('button', 'btn', 'Apply it for me');
        ap.style.marginTop = '9px';
        ap.addEventListener('click', () => {
          pushUndo();
          const st = { grid: g.grid, cands: g.cands };
          S.applyMove(st, m);
          g.hintMove = null; g.hint = 0;
          renderPlay();
        });
        w.appendChild(ap);
      }
    }

    if (filled === 81 && !conflicts.size) {
      if (!g.celebrated) { g.celebrated = true; buzz([20, 60, 30, 60, 90]); }
      const done = el('div', 'fb ok confetti');
      done.innerHTML = `<div class="h">Solved! 🏆🎉</div>${Math.floor(secs / 60)}m ${secs % 60}s, ${plural(g.mistakes, 'slip')}. Go show the other one.`;
      w.appendChild(done);
      const again = el('button', 'btn primary', 'Another puzzle');
      again.style.marginTop = '11px';
      again.addEventListener('click', () => go('playpick'));
      w.appendChild(again);
    }
  }

  function tool(k, label, on, fn) {
    const b = el('button', 'tool' + (on ? ' on' : ''));
    b.innerHTML = `<span class="k">${k}</span>${esc(label)}`;
    b.addEventListener('click', fn);
    return b;
  }

  function pushUndo() {
    game.undo.push({ grid: Int8Array.from(game.grid), cands: Int16Array.from(game.cands) });
    if (game.undo.length > 60) game.undo.shift();
  }

  function enter(dg) {
    const g = game;
    if (g.cursor == null) return toast('Pick a cell first.');
    const c = g.cursor;
    if (g.given[c] !== '.') return toast('That is one of the original clues.');
    buzz(6);
    pushUndo();
    if (g.notes) {
      g.cands[c] ^= S.bit(dg);
    } else {
      if (g.grid[c] === dg) { g.grid[c] = 0; }
      else {
        g.grid[c] = dg;
        g.cands[c] = 0;
        if (g.puz.s[c] !== String(dg)) g.mistakes++;
        // keep the notes honest, exactly as the Notes lesson preaches
        for (const p of S.PEERS[c]) g.cands[p] &= ~S.bit(dg);
      }
    }
    g.hintMove = null; g.hint = 0; g.slip = null;
    renderPlay();
  }

  function doNudge() {
    const g = game;
    if (g.hintMove) { g.hint = Math.min(3, g.hint + 1); return renderPlay(); }

    // A wrong digit makes every downstream technique lie, so say so plainly and
    // name the cell instead of failing quietly. This is the most common reason
    // a real board goes unsolvable, and it is invisible until someone says it.
    const slips = [];
    for (let c = 0; c < 81; c++) {
      if (g.grid[c] && g.puz.s[c] !== String(g.grid[c])) slips.push(c);
    }
    if (slips.length) {
      g.slip = slips;
      g.hintMove = null; g.hint = 0;
      return renderPlay();
    }
    g.slip = null;

    // Hint from the true candidates, not the player's notes, so a missing note
    // never hides a legitimate move.
    const st = { grid: Int8Array.from(g.grid), cands: S.computeCands(g.grid) };
    const m = S.nextMove(st);
    if (!m) { toast('Nothing on this ladder fits here.'); return; }
    g.hintMove = m; g.hint = 1;
    renderPlay();
  }

  // ---------------------------------------------------------- daily challenge

  routes.daily = function () {
    const day = todayStr();
    const w = screen('Daily Challenge', 'home');
    const rec = P.daily[day];

    const head = el('div', 'card');
    head.innerHTML = `<div style="font-size:30px">📅</div>
      <div style="font-weight:800;font-size:19px;margin-top:4px">${day}</div>
      <div class="muted" style="margin-top:6px;font-size:15px">The puzzle and the six drills are picked from today's date, so both of your phones get <b>exactly the same set</b>. No accounts, no server. Play separately, compare after.</div>`;
    w.appendChild(head);

    if (rec) {
      const c = el('div', 'card');
      c.innerHTML = `<div class="scoreline"><span>Spot Check</span><span class="v">${rec.right}/${rec.n}</span></div>
        <div class="scoreline"><span>Time</span><span class="v">${Math.floor(rec.secs / 60)}m ${rec.secs % 60}s</span></div>
        <div class="scoreline"><span>Clean spots</span><span class="v">${rec.clean}</span></div>`;
      w.appendChild(c);
      const share = el('button', 'btn primary', '📋 Copy my result');
      share.addEventListener('click', () => {
        const txt = shareText(day, rec);
        navigator.clipboard ? navigator.clipboard.writeText(txt).then(() => toast('Copied. Go paste it.')) : prompt('Copy this:', txt);
      });
      w.appendChild(share);
      const p = el('button', 'btn', '🎮 Today\'s full puzzle');
      p.style.marginTop = '9px';
      p.addEventListener('click', () => go('play:seed|' + day));
      w.appendChild(p);
    } else {
      const start = el('button', 'btn primary', 'Start today\'s six');
      start.addEventListener('click', () => startDaily(day));
      w.appendChild(start);
    }

    const hist = Object.keys(P.daily).sort().reverse().slice(0, 7);
    if (hist.length) {
      const s2 = el('section');
      s2.appendChild(el('h3', 'sec', 'Last seven'));
      const c = el('div', 'card');
      c.innerHTML = hist.map(d2 => {
        const r = P.daily[d2];
        return `<div class="scoreline"><span>${d2}</span><span class="v">${r.right}/${r.n} &middot; ${Math.floor(r.secs / 60)}:${String(r.secs % 60).padStart(2, '0')}</span></div>`;
      }).join('');
      s2.appendChild(c);
      w.appendChild(s2);
    }
  };

  function startDaily(day) {
    // Deterministic pick: same date -> same drills on every device.
    const h = hashStr(day);
    const list = [];
    for (let i = 0; i < 6; i++) {
      const t = TECHS[(h + i * 7919) % TECHS.length];
      const bank = DATA.drills[t.id];
      list.push(bank[(h + i * 104729) % bank.length]);
    }
    session = { kind: 'daily', day, list, i: 0, right: 0, firstTry: 0, tries: 0, hint: 0, started: Date.now(), identify: true };
    renderDrill();
  }

  function shareText(day, rec) {
    const squares = rec.marks.map(m => m === 2 ? '🟪' : m === 1 ? '🟨' : '⬛').join('');
    return `Sudoku Lab ${day}\n${squares} ${rec.right}/${rec.n}\n${Math.floor(rec.secs / 60)}m ${rec.secs % 60}s`;
  }

  // ------------------------------------------------------------ pass & play

  routes.versus = function () {
    const w = screen('Pass & Play', 'home');
    w.appendChild(el('div', 'callout', 'One phone, two people, alternating drills. Same technique both of you, so it is a fair race. Winner gets to pick the next puzzle.'));
    const c = el('div', 'card');
    c.innerHTML = `<div style="font-weight:700;margin-bottom:10px">Who is playing?</div>`;
    const a = el('input'); a.type = 'text'; a.placeholder = 'Player one'; a.value = P.name || '';
    const b = el('input'); b.type = 'text'; b.placeholder = 'Player two'; b.style.marginTop = '9px';
    c.appendChild(a); c.appendChild(b);
    w.appendChild(c);
    const start = el('button', 'btn primary', 'Start, 6 rounds');
    start.style.marginTop = '12px';
    start.addEventListener('click', () => {
      const names = [(a.value || 'Player one').trim(), (b.value || 'Player two').trim()];
      const list = [];
      const pool = TECHS.filter(t => techStat(t.id).seen > 0);
      const from = (pool.length ? pool : TECHS);
      for (let i = 0; i < 6; i++) {
        const t = from[(Math.random() * from.length) | 0];
        const bank = DATA.drills[t.id];
        list.push(bank[(Math.random() * bank.length) | 0]);
      }
      session = { kind: 'vs', names, scores: [0, 0], list, i: 0, right: 0, firstTry: 0,
        tries: 0, hint: 0, started: Date.now(), identify: true };
      renderDrill();
    });
    w.appendChild(start);
  };

  // ------------------------------------------------------------------- boot

  const boot = () => render(location.hash.slice(1) || 'home');
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  window.addEventListener('error', e => {
    const w = $('#app');
    if (w) w.innerHTML = `<div class="wrap"><div class="fb no" style="margin-top:40px">
      <div class="h">Something broke</div>${esc(e.message)}<br><br>
      <a href="#" onclick="location.reload()">Reload</a></div></div>`;
  });

})();

</script>
