<style>
:root{
  --bg:#faf8ff; --bg2:#f3effc; --card:#ffffff; --card2:#f6f3fd; --line:#e6e0f3;
  --ink:#241d3d; --muted:#5f5880; --dim:#8c86a6;
  --accent:#6d4df0; --accent2:#a855f7;
  --grad:linear-gradient(135deg,var(--accent),var(--accent2));
  --good:#0e9f6e; --warn:#c27803; --bad:#e02444;
  --grid:#e2dcf1; --grid2:#9e93c4;
  --cellbg:#ffffff;
  --radius:16px;
  --shadow:0 1px 3px rgba(60,40,120,.07),0 4px 14px rgba(60,40,120,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
.wrap.anim{animation:fadeUp .22s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.tile.locked{opacity:.55}
a{color:var(--accent)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* ---------------------------------------------------------------- top bar */
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(250,248,255,.9);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.topbar-in{max-width:560px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.back{width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--line);
  display:grid;place-items:center;font-size:18px;flex:none;box-shadow:var(--shadow)}
.topbar h1{font-size:16px;margin:0;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who{font-size:12px;color:var(--dim);background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:5px 11px;flex:none}

/* ------------------------------------------------------------------- hero */
.hero{padding:22px 0 6px;text-align:center}
.hero .made{color:var(--dim);font-size:13px;margin:6px 0 0;font-weight:600}
.kick{letter-spacing:.2em;text-transform:uppercase;font-size:11px;color:var(--accent);font-weight:700}
.hero h2{font-size:clamp(28px,8vw,40px);line-height:1.05;margin:12px 0 8px;font-weight:800;
  background:linear-gradient(120deg,var(--ink) 30%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);margin:0 auto;max-width:400px;font-size:15px}

/* ------------------------------------------------------------------ cards */
section{margin-top:30px}
h3.sec{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
  font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:9px}
h3.sec:before{content:"";width:20px;height:3px;background:var(--grad);border-radius:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card+.card{margin-top:12px}
.callout{background:color-mix(in srgb,var(--accent) 7%,#fff);
  border:1px solid color-mix(in srgb,var(--accent) 22%,#fff);
  border-left:4px solid var(--accent);border-radius:10px;padding:13px 15px;margin:14px 0;font-size:15px}
.callout b{color:var(--ink)}
.callout.good{background:color-mix(in srgb,var(--good) 8%,#fff);
  border-color:color-mix(in srgb,var(--good) 30%,#fff);border-left-color:var(--good)}
.callout.bad{background:color-mix(in srgb,var(--bad) 7%,#fff);
  border-color:color-mix(in srgb,var(--bad) 28%,#fff);border-left-color:var(--bad)}
.muted{color:var(--muted)}
.dim{color:var(--dim);font-size:13px}

/* --------------------------------------------------------------- tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;
  text-align:left;display:block;width:100%;transition:transform .12s,border-color .12s;box-shadow:var(--shadow)}
.tile:active{transform:scale(.97);border-color:var(--accent)}
.tile .ic{font-size:22px}
.tile .t{font-weight:700;margin-top:6px;font-size:15px}
.tile .d{color:var(--dim);font-size:12.5px;line-height:1.4;margin-top:2px}
.tile.wide{grid-column:1/-1}

/* ------------------------------------------------------------ technique row */
.tier-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
  font-weight:700;margin:20px 0 8px;display:flex;align-items:center;gap:8px}
.tier-label span{flex:1;height:1px;background:var(--line)}
.trow{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:13px 15px;width:100%;text-align:left;margin-bottom:9px;
  transition:transform .12s,border-color .12s;box-shadow:var(--shadow)}
.trow:active{transform:scale(.985)}
.trow.done{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.trow.locked{opacity:.45}
.trow .ring{flex:none;width:40px;height:40px;position:relative;display:grid;place-items:center}
.trow .ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.trow .ring b{font-size:12px;font-weight:800;position:relative}
.trow .body{flex:1;min-width:0}
.trow .nm{font-weight:700;font-size:15px}
.trow .al{color:var(--accent);font-size:12px;font-weight:600}
.trow .sb{color:var(--dim);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .chev{color:var(--dim);flex:none}

/* ------------------------------------------------------------------ board */
.boardwrap{margin:14px 0}
.board{display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);
  aspect-ratio:1;width:100%;
  background:var(--grid);border:2px solid var(--grid2);border-radius:10px;overflow:hidden;
  gap:1px;touch-action:manipulation;user-select:none;box-shadow:var(--shadow)}
.cell{background:var(--cellbg);display:grid;place-items:center;position:relative;min-height:0;min-width:0;
  font-size:clamp(15px,5.4vw,25px);font-weight:600;line-height:1;transition:background .1s}
.cell.bt{box-shadow:inset 0 2px 0 0 var(--grid2)}
.cell.bl{box-shadow:inset 2px 0 0 0 var(--grid2)}
.cell.bt.bl{box-shadow:inset 0 2px 0 0 var(--grid2), inset 2px 0 0 0 var(--grid2)}
.cell.given{color:var(--ink)}
.cell.placed{color:var(--accent)}
.cell.conflict{color:var(--bad)}
.cell.unit{background:#f1ecfb}
.cell.peer{background:#f5f2fc}
.cell.same{background:#e4dbf9}
.cell.sel{background:#d9ccff;outline:2px solid var(--accent);outline-offset:-2px;z-index:2}
.cell.pattern{background:#e2d6ff;outline:2px solid var(--accent);outline-offset:-2px;z-index:2;
  animation:patPulse 2.2s ease-in-out infinite}
.cell.elim{background:#ffe4e8}
.cell.blocker{background:#fff2cc}
.cell.cursor{outline:2px solid var(--ink);outline-offset:-2px;z-index:3}
.notes{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  width:100%;height:100%;padding:1px}
.notes i{display:grid;place-items:center;font-style:normal;font-weight:600;
  font-size:clamp(7px,2.15vw,11px);color:var(--dim);line-height:1}
.notes i.hi{color:var(--accent);font-weight:800}
.notes i.dead{color:var(--bad);text-decoration:line-through;font-weight:800;
  animation:deadPulse 2.2s ease-in-out infinite}

@keyframes patPulse{
  0%,100%{outline-color:var(--accent)}
  50%{outline-color:var(--accent2);background:#d9c9ff}
}
@keyframes deadPulse{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){
  .cell.pattern,.notes i.dead,.demo *{animation:none !important}
}

/* ------------------------------------------------------------ digit picker */
.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin:12px 0}
.pad button{aspect-ratio:.85;background:var(--card);border:1px solid var(--line);border-radius:9px;
  font-size:clamp(15px,4.6vw,21px);font-weight:700;display:grid;place-items:center;position:relative;
  box-shadow:var(--shadow)}
.pad button:active{transform:scale(.94)}
.pad button.on{background:var(--grad);border-color:transparent;color:#fff}
.pad button.gone{opacity:.3}
.pad button em{position:absolute;bottom:2px;font-style:normal;font-size:9px;color:var(--dim);font-weight:600}
.pad button.on em{color:rgba(255,255,255,.8)}

/* ----------------------------------------------------------------- buttons */
.btn{display:block;width:100%;padding:14px;border-radius:12px;background:var(--card);
  border:1px solid var(--line);font-weight:700;font-size:15px;text-align:center;box-shadow:var(--shadow)}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff}
.btn.ghost{background:transparent;box-shadow:none}
.btn[disabled]{opacity:.4}
.btnrow{display:flex;gap:9px;margin-top:11px}
.btnrow .btn{flex:1}
.toolrow{display:flex;gap:7px;margin:10px 0}
.tool{flex:1;padding:10px 4px;border-radius:10px;background:var(--card);border:1px solid var(--line);
  font-size:12.5px;font-weight:600;text-align:center;box-shadow:var(--shadow)}
.tool.on{background:var(--grad);border-color:transparent;color:#fff}
.tool .k{display:block;font-size:17px;margin-bottom:2px}

/* ------------------------------------------------------------------ prompt */
.prompt{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);
  border-radius:14px;padding:15px;margin-bottom:2px;box-shadow:var(--shadow)}
.prompt .q{font-weight:700;font-size:15.5px}
.prompt .s{color:var(--muted);font-size:13.5px;margin-top:4px}
.chipline{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;
  font-size:12.5px;font-weight:600}
.chip b{color:var(--accent)}
button.chip:active{transform:scale(.95)}

/* ---------------------------------------------------------------- feedback */
.fb{border-radius:12px;padding:14px 15px;margin-top:12px;font-size:14.5px;line-height:1.5}
.fb.ok{background:color-mix(in srgb,var(--good) 9%,#fff);border:1px solid color-mix(in srgb,var(--good) 32%,#fff)}
.fb.no{background:color-mix(in srgb,var(--bad) 7%,#fff);border:1px solid color-mix(in srgb,var(--bad) 30%,#fff)}
.fb.warn{background:color-mix(in srgb,var(--warn) 9%,#fff);border:1px solid color-mix(in srgb,var(--warn) 32%,#fff)}
.fb .h{font-weight:800;margin-bottom:4px}
.fb.ok .h{color:var(--good)} .fb.no .h{color:var(--bad)} .fb.warn .h{color:var(--warn)}

/* -------------------------------------------------------------- lesson body */
.lesson h4{font-size:15px;margin:20px 0 6px;color:var(--ink)}
.lesson p{margin:0 0 10px;color:var(--muted);font-size:15px}
.lesson p strong,.lesson li strong{color:var(--ink)}
.lesson ul,.lesson ol{margin:0 0 12px;padding-left:20px;color:var(--muted);font-size:15px}
.lesson li{margin-bottom:6px}
.lesson code{background:var(--card2);border:1px solid var(--line);padding:1px 6px;border-radius:5px;
  font-size:13.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent)}
.meta-note{font-size:14px;color:var(--muted)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.vs>div{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:13px}
.vs .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--accent);margin-bottom:5px}
.vs .txt{font-size:13.5px;color:var(--muted);line-height:1.45}

/* ------------------------------------------------------- animated diagrams */
.demo{display:flex;flex-direction:column;align-items:center;margin:16px 0}
.demo svg{width:min(270px,86%);height:auto;overflow:visible}
.demo .cap{font-size:13px;color:var(--dim);margin-top:8px;text-align:center;max-width:300px}
.demo .gridline{stroke:var(--grid);stroke-width:1.5}
.demo .gridbold{stroke:var(--grid2);stroke-width:2.5;fill:none}
.demo .cellbg{fill:#fff}
.demo text{font-family:inherit;font-weight:700}

/* swipe demo: beams sweep in, the last open cell gets its digit */
.demo .beam{fill:var(--accent);opacity:0;transform-box:fill-box}
.demo .beamH{transform-origin:left center;animation:beamH 7s ease-in-out infinite}
.demo .beamV{transform-origin:center top;animation:beamV 7s ease-in-out infinite}
.demo .d1{animation-delay:.0s}.demo .d2{animation-delay:.7s}
.demo .d3{animation-delay:1.4s}.demo .d4{animation-delay:2.1s}
@keyframes beamH{0%{transform:scaleX(0);opacity:0}6%{transform:scaleX(1);opacity:.32}
  80%{transform:scaleX(1);opacity:.32}92%,100%{transform:scaleX(1);opacity:0}}
@keyframes beamV{0%{transform:scaleY(0);opacity:0}6%{transform:scaleY(1);opacity:.32}
  80%{transform:scaleY(1);opacity:.32}92%,100%{transform:scaleY(1);opacity:0}}
.demo .popdigit{opacity:0;transform-box:fill-box;transform-origin:center;
  animation:popDigit 7s ease-in-out infinite}
@keyframes popDigit{0%,42%{opacity:0;transform:scale(.3)}
  50%{opacity:1;transform:scale(1.25)}55%{transform:scale(1)}
  85%{opacity:1;transform:scale(1)}95%,100%{opacity:0;transform:scale(1)}}
.demo .popring{fill:none;stroke:var(--accent);stroke-width:2.5;opacity:0;transform-box:fill-box;
  transform-origin:center;animation:popRing 7s ease-in-out infinite}
@keyframes popRing{0%,42%{opacity:0;transform:scale(.4)}
  52%{opacity:1;transform:scale(1)}85%{opacity:.8}95%,100%{opacity:0}}

/* x-wing demo: corners pulse, columns claim, wrong candidates die */
.demo .corner{fill:#e2d6ff;stroke:var(--accent);stroke-width:2;
  animation:cornerPulse 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes cornerPulse{0%,100%{fill:#e2d6ff}45%{fill:#cdbaff}}
.demo .colbar{fill:var(--accent);opacity:0;animation:colBar 6s ease-in-out infinite}
@keyframes colBar{0%,30%{opacity:0}42%{opacity:.16}80%{opacity:.16}92%,100%{opacity:0}}
.demo .dieX{opacity:0;animation:dieX 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dieX{0%,48%{opacity:0;transform:scale(.4)}58%{opacity:1;transform:scale(1)}
  85%{opacity:1}95%,100%{opacity:0}}

/* pair demo: twin cells glow, their digits die in the neighbor */
.demo .twin{fill:#e2d6ff;stroke:var(--accent);stroke-width:2;
  animation:cornerPulse 6s ease-in-out infinite}

<body>
<div id="app"></div>
<script>
/*
 * Sudoku engine + human-style technique solver.
 *
 * Shared by the drill generator (Node) and the trainer app (browser), so the
 * logic the app teaches is literally the logic that built its practice
 * positions. One source of truth, no drift.
 *
 * Representation:
 *   grid   Int8Array(81), 0 = empty, 1..9 = placed
 *   cands  Int16Array(81), bitmask, bit (d-1) set = digit d still possible
 *   state  { grid, cands }
 *
 * Every detector returns a Move:
 *   { id, name, digit(s), cells, units, placements, eliminations, note }
 * where `cells` is the pattern the player is asked to spot.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Sudoku = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ---------------------------------------------------------------- geometry

  const ROWS = [], COLS = [], BOXES = [];
  for (let i = 0; i < 9; i++) { ROWS.push([]); COLS.push([]); BOXES.push([]); }
  for (let c = 0; c < 81; c++) {
    const r = (c / 9) | 0, col = c % 9;
    const b = ((r / 3) | 0) * 3 + ((col / 3) | 0);
    ROWS[r].push(c); COLS[col].push(c); BOXES[b].push(c);
  }
  // UNITS: 0-8 rows, 9-17 cols, 18-26 boxes
  const UNITS = ROWS.concat(COLS, BOXES);
  const UNIT_KIND = i => (i < 9 ? 'row' : i < 18 ? 'col' : 'box');
  const UNIT_NO = i => (i % 9) + 1;

  const rowOf = c => (c / 9) | 0;
  const colOf = c => c % 9;
  const boxOf = c => ((rowOf(c) / 3) | 0) * 3 + ((colOf(c) / 3) | 0);
  const unitsOf = c => [rowOf(c), 9 + colOf(c), 18 + boxOf(c)];

  const PEERS = [];
  for (let c = 0; c < 81; c++) {
    const s = new Set();
    for (const u of unitsOf(c)) for (const p of UNITS[u]) if (p !== c) s.add(p);
    PEERS.push(Array.from(s));
  }

  // ------------------------------------------------------------------- bits

  const bit = d => 1 << (d - 1);
  const ALL = 0x1ff;

  function popcount(m) { let n = 0; while (m) { m &= m - 1; n++; } return n; }
  function digitsOf(m) {
    const out = [];
    for (let d = 1; d <= 9; d++) if (m & bit(d)) out.push(d);
    return out;
  }
  function lowestDigit(m) { for (let d = 1; d <= 9; d++) if (m & bit(d)) return d; return 0; }

  // ------------------------------------------------------------ names / io

  const cellName = c => 'R' + (rowOf(c) + 1) + 'C' + (colOf(c) + 1);
  const cellNames = list => list.map(cellName).join(', ');
  const unitName = u => UNIT_KIND(u) === 'row' ? 'row ' + UNIT_NO(u)
    : UNIT_KIND(u) === 'col' ? 'column ' + UNIT_NO(u)
      : 'box ' + UNIT_NO(u);

  function parse(str) {
    const g = new Int8Array(81);
    let i = 0;
    for (const ch of String(str)) {
      if (i >= 81) break;
      if (ch >= '1' && ch <= '9') g[i++] = ch.charCodeAt(0) - 48;
      else if (ch === '0' || ch === '.' || ch === '-') g[i++] = 0;
    }
    return g;
  }
  const toStr = g => Array.from(g).map(v => v || '.').join('');

  // ------------------------------------------------------------- candidates

  function computeCands(grid) {
    const cands = new Int16Array(81);
    for (let c = 0; c < 81; c++) {
      if (grid[c]) { cands[c] = 0; continue; }
      let m = ALL;
      for (const p of PEERS[c]) if (grid[p]) m &= ~bit(grid[p]);
      cands[c] = m;
    }
    return cands;
  }

  const makeState = grid => ({ grid: Int8Array.from(grid), cands: computeCands(grid) });
  const cloneState = s => ({ grid: Int8Array.from(s.grid), cands: Int16Array.from(s.cands) });

  function place(state, cell, digit) {
    state.grid[cell] = digit;
    state.cands[cell] = 0;
    for (const p of PEERS[cell]) state.cands[p] &= ~bit(digit);
  }

  function applyMove(state, move) {
    for (const e of move.eliminations || []) state.cands[e.cell] &= ~bit(e.digit);
    for (const p of move.placements || []) place(state, p.cell, p.digit);
  }

  function isSolved(state) {
    for (let c = 0; c < 81; c++) if (!state.grid[c]) return false;
    return true;
  }

  // Contradiction: an empty cell with no candidates, or a digit with no home.
  function isBroken(state) {
    for (let c = 0; c < 81; c++) if (!state.grid[c] && !state.cands[c]) return true;
    for (const u of UNITS) {
      for (let d = 1; d <= 9; d++) {
        let seen = false;
        for (const c of u) {
          if (state.grid[c] === d || (!state.grid[c] && (state.cands[c] & bit(d)))) { seen = true; break; }
        }
        if (!seen) return true;
      }
    }
    return false;
  }

  // ------------------------------------------------------- brute-force solve

  // Returns number of solutions found, up to `limit`. Fills `out` with the first.
  function countSolutions(grid, limit, out) {
    const g = Int8Array.from(grid);
    let found = 0;

    function rec() {
      // pick the most constrained empty cell
      let best = -1, bestMask = 0, bestN = 10;
      for (let c = 0; c < 81; c++) {
        if (g[c]) continue;
        let m = ALL;
        for (const p of PEERS[c]) if (g[p]) m &= ~bit(g[p]);
        const n = popcount(m);
        if (n === 0) return false;
        if (n < bestN) { bestN = n; best = c; bestMask = m; if (n === 1) break; }
      }
      if (best === -1) {
        found++;
        if (out && found === 1) out.set(g);
        return found >= limit;
      }
      for (const d of digitsOf(bestMask)) {
        g[best] = d;
        if (rec()) return true;
        g[best] = 0;
      }
      return false;
    }

    rec();
    return found;
  }

  const solve = grid => {
    const out = new Int8Array(81);
    return countSolutions(grid, 1, out) ? out : null;
  };
  const hasUniqueSolution = grid => countSolutions(grid, 2) === 1;

  // =========================================================================
  //  TECHNIQUES
  // =========================================================================
  // Ordered easiest -> hardest. `nextMove` walks this list in order, so the
  // move it returns is always the simplest thing that works right now -- which
  // is exactly what makes a position a fair drill for that technique.

  function mkMove(o) {
    return Object.assign({
      digits: o.digit ? [o.digit] : (o.digits || []),
      cells: [], units: [], placements: [], eliminations: [], extra: []
    }, o);
  }

  // ---- 1. Naked single: a cell with exactly one candidate left.
  function findNakedSingle(state) {
    for (let c = 0; c < 81; c++) {
      if (state.grid[c] || popcount(state.cands[c]) !== 1) continue;
      const d = lowestDigit(state.cands[c]);
      return mkMove({
        id: 'naked-single', digit: d, cells: [c], units: unitsOf(c),
        placements: [{ cell: c, digit: d }],
        note: `${cellName(c)} had nine options and lost eight of them to its row, column and box. Last number standing: ${d}. 🏆`
      });
    }
    return null;
  }

  // ---- 2. Hidden single: in some unit, a digit has exactly one home.
  //         This is Kevin & Crissy's "swipe method".
  function findHiddenSingle(state) {
    for (let u = 0; u < 27; u++) {
      const unit = UNITS[u];
      for (let d = 1; d <= 9; d++) {
        let spot = -1, count = 0, placed = false;
        for (const c of unit) {
          if (state.grid[c] === d) { placed = true; break; }
          if (!state.grid[c] && (state.cands[c] & bit(d))) { count++; spot = c; }
        }
        if (placed || count !== 1) continue;
        // The "swipe lines": the placed digits that ruled out every other cell.
        const blockers = [];
        for (const c of unit) {
          if (c === spot || state.grid[c]) continue;
          for (const p of PEERS[c]) if (state.grid[p] === d && !blockers.includes(p)) { blockers.push(p); break; }
        }
        return mkMove({
          id: 'hidden-single', digit: d, cells: [spot], units: [u], extra: blockers,
          placements: [{ cell: spot, digit: d }],
          note: `${d} has exactly one home left in ${unitName(u)}: ${cellName(spot)}. Swipe says so. 👆`
        });
      }
    }
    return null;
  }

  // ---- 3/5. Naked subsets: N cells in a unit sharing exactly N candidates.
  function findNakedSubset(state, size) {
    for (let u = 0; u < 27; u++) {
      const open = UNITS[u].filter(c => !state.grid[c] && popcount(state.cands[c]) >= 2
        && popcount(state.cands[c]) <= size);
      if (open.length <= size) continue;
      for (const combo of combinations(open, size)) {
        let mask = 0;
        for (const c of combo) mask |= state.cands[c];
        if (popcount(mask) !== size) continue;
        const ds = digitsOf(mask);
        const elims = [];
        for (const c of UNITS[u]) {
          if (state.grid[c] || combo.includes(c)) continue;
          for (const d of ds) if (state.cands[c] & bit(d)) elims.push({ cell: c, digit: d });
        }
        if (!elims.length) continue;
        return mkMove({
          id: size === 2 ? 'naked-pair' : size === 3 ? 'naked-triple' : 'naked-quad',
          digits: ds, cells: combo.slice(), units: [u], eliminations: elims,
          note: `${cellNames(combo)} only have ${ds.join(' and ')} between them. Those seats are taken, so nobody else in ${unitName(u)} gets ${ds.join(' or ')}. 🪑`
        });
      }
    }
    return null;
  }

  // ---- 4/6. Hidden subsets: N digits in a unit confined to exactly N cells.
  function findHiddenSubset(state, size) {
    for (let u = 0; u < 27; u++) {
      const unit = UNITS[u];
      const spots = {};
      for (let d = 1; d <= 9; d++) {
        const list = unit.filter(c => !state.grid[c] && (state.cands[c] & bit(d)));
        if (list.length >= 2 && list.length <= size) spots[d] = list;
      }
      const ds = Object.keys(spots).map(Number);
      if (ds.length < size) continue;
      for (const combo of combinations(ds, size)) {
        const cellSet = new Set();
        for (const d of combo) for (const c of spots[d]) cellSet.add(c);
        if (cellSet.size !== size) continue;
        let mask = 0;
        for (const d of combo) mask |= bit(d);
        const cells = Array.from(cellSet).sort((a, b) => a - b);
        const elims = [];
        for (const c of cells) {
          for (const d of digitsOf(state.cands[c] & ~mask)) elims.push({ cell: c, digit: d });
        }
        if (!elims.length) continue;
        return mkMove({
          id: size === 2 ? 'hidden-pair' : size === 3 ? 'hidden-triple' : 'hidden-quad',
          digits: combo.slice(), cells, units: [u], eliminations: elims,
          note: `In ${unitName(u)}, ${combo.join(' and ')} can ONLY live in ${cellNames(cells)}. Those cells are reserved. Every other number written in them is a bluff, wipe it. 🧹`
        });
      }
    }
    return null;
  }

  // ---- 7. Locked candidates, pointing: in a box, digit confined to one line.
  function findPointing(state) {
    for (let b = 0; b < 9; b++) {
      const box = BOXES[b];
      for (let d = 1; d <= 9; d++) {
        const spots = box.filter(c => !state.grid[c] && (state.cands[c] & bit(d)));
        if (spots.length < 2 || spots.length > 3) continue;
        const sameRow = spots.every(c => rowOf(c) === rowOf(spots[0]));
        const sameCol = spots.every(c => colOf(c) === colOf(spots[0]));
        if (!sameRow && !sameCol) continue;
        const lineU = sameRow ? rowOf(spots[0]) : 9 + colOf(spots[0]);
        const elims = [];
        for (const c of UNITS[lineU]) {
          if (state.grid[c] || spots.includes(c)) continue;
          if (state.cands[c] & bit(d)) elims.push({ cell: c, digit: d });
        }
        if (!elims.length) continue;
        return mkMove({
          id: 'pointing', digit: d, cells: spots, units: [18 + b, lineU], eliminations: elims,
          note: `In box ${b + 1}, every possible ${d} sits on ${unitName(lineU)}. So that box's ${d} is coming out on this line for sure, and the rest of ${unitName(lineU)} can forget about ${d}. 🚪`
        });
      }
    }
    return null;
  }

  // ---- 8. Locked candidates, claiming: in a line, digit confined to one box.
  function findClaiming(state) {
    for (let u = 0; u < 18; u++) {
      for (let d = 1; d <= 9; d++) {
        const spots = UNITS[u].filter(c => !state.grid[c] && (state.cands[c] & bit(d)));
        if (spots.length < 2 || spots.length > 3) continue;
        const b = boxOf(spots[0]);
        if (!spots.every(c => boxOf(c) === b)) continue;
        const elims = [];
        for (const c of BOXES[b]) {
          if (state.grid[c] || spots.includes(c)) continue;
          if (state.cands[c] & bit(d)) elims.push({ cell: c, digit: d });
        }
        if (!elims.length) continue;
        return mkMove({
          id: 'claiming', digit: d, cells: spots, units: [u, 18 + b], eliminations: elims,
          note: `${unitName(u)} can only fit its ${d} inside box ${b + 1}. That box's ${d} is claimed, so ${d} vanishes from the rest of the box. 🏷️`
        });
      }
    }
    return null;
  }

  // ---- 9/11. Fish: X-Wing (2 lines) and Swordfish (3 lines).
  function findFish(state, size) {
    for (let d = 1; d <= 9; d++) {
      for (const orient of [0, 1]) { // 0 = base rows, 1 = base cols
        const base = [];
        for (let i = 0; i < 9; i++) {
          const u = orient ? 9 + i : i;
          const spots = UNITS[u].filter(c => !state.grid[c] && (state.cands[c] & bit(d)));
          if (spots.length >= 2 && spots.length <= size) base.push({ u, i, spots });
        }
        if (base.length < size) continue;
        for (const combo of combinations(base, size)) {
          const cross = new Set();
          for (const b of combo) for (const c of b.spots) cross.add(orient ? rowOf(c) : colOf(c));
          if (cross.size !== size) continue;
          const cells = [];
          for (const b of combo) for (const c of b.spots) cells.push(c);
          const elims = [];
          for (const x of cross) {
            const u = orient ? x : 9 + x;
            for (const c of UNITS[u]) {
              if (state.grid[c] || cells.includes(c)) continue;
              if (state.cands[c] & bit(d)) elims.push({ cell: c, digit: d });
            }
          }
          if (!elims.length) continue;
          const baseNames = combo.map(b => (orient ? 'column ' : 'row ') + (b.i + 1)).join(' and ');
          const crossNames = Array.from(cross).map(x => (orient ? 'row ' : 'column ') + (x + 1)).join(' and ');
          return mkMove({
            id: size === 2 ? 'x-wing' : 'swordfish',
            digit: d, cells: cells.sort((a, b2) => a - b2),
            units: combo.map(b => b.u).concat(Array.from(cross).map(x => orient ? x : 9 + x)),
            eliminations: elims,
            note: `${d} in ${baseNames} is trapped in ${crossNames}. However the corners land, those lines get their ${d} from inside this shape, so ${d} is banned everywhere else in them. 📐`
          });
        }
      }
    }
    return null;
  }

  // ---- 10. XY-Wing: pivot {x,y} + wings {x,z} and {y,z} -> z dies where both see.
  function findXYWing(state) {
    const bi = [];
    for (let c = 0; c < 81; c++) if (!state.grid[c] && popcount(state.cands[c]) === 2) bi.push(c);
    for (const pivot of bi) {
      const [x, y] = digitsOf(state.cands[pivot]);
      const seen = bi.filter(c => c !== pivot && PEERS[pivot].includes(c));
      for (const w1 of seen) {
        const m1 = state.cands[w1];
        for (const w2 of seen) {
          if (w2 <= w1) continue;
          const m2 = state.cands[w2];
          // w1 = {x,z}, w2 = {y,z}
          let z = 0;
          if ((m1 & bit(x)) && (m2 & bit(y)) && !(m1 & bit(y)) && !(m2 & bit(x))) {
            z = lowestDigit(m1 & m2);
          } else if ((m1 & bit(y)) && (m2 & bit(x)) && !(m1 & bit(x)) && !(m2 & bit(y))) {
            z = lowestDigit(m1 & m2);
          }
          if (!z || z === x || z === y) continue;
          const elims = [];
          for (let c = 0; c < 81; c++) {
            if (state.grid[c] || c === pivot || c === w1 || c === w2) continue;
            if (!(state.cands[c] & bit(z))) continue;
            if (PEERS[w1].includes(c) && PEERS[w2].includes(c)) elims.push({ cell: c, digit: z });
          }
          if (!elims.length) continue;
          return mkMove({
            id: 'xy-wing', digit: z, digits: [x, y, z].filter((v, i, a) => a.indexOf(v) === i),
            cells: [pivot, w1, w2].sort((a, b) => a - b), units: [],
            extra: [pivot], eliminations: elims,
            note: `${cellName(pivot)} is ${x} or ${y}, no third option. Either way, one of its wings snaps to ${z}. So any cell that sees BOTH wings is staring at a guaranteed ${z} and can never be one. 💡`
          });
        }
      }
    }
    return null;
  }

  // ------------------------------------------------------------- combinations

  function* combinations(arr, k) {
    const n = arr.length;
    if (k > n) return;
    const idx = Array.from({ length: k }, (_, i) => i);
    while (true) {
      yield idx.map(i => arr[i]);
      let i = k - 1;
      while (i >= 0 && idx[i] === n - k + i) i--;
      if (i < 0) return;
      idx[i]++;
      for (let j = i + 1; j < k; j++) idx[j] = idx[j - 1] + 1;
    }
  }

  // ------------------------------------------------------------ the ladder

  const TECHNIQUES = [
    { id: 'naked-single', name: 'Naked Single', tier: 1, find: findNakedSingle },
    { id: 'hidden-single', name: 'Hidden Single', tier: 1, find: findHiddenSingle },
    { id: 'naked-pair', name: 'Naked Pair', tier: 2, find: s => findNakedSubset(s, 2) },
    { id: 'hidden-pair', name: 'Hidden Pair', tier: 2, find: s => findHiddenSubset(s, 2) },
    { id: 'pointing', name: 'Pointing Pair', tier: 3, find: findPointing },
    { id: 'claiming', name: 'Box-Line Reduction', tier: 3, find: findClaiming },
    { id: 'naked-triple', name: 'Naked Triple', tier: 4, find: s => findNakedSubset(s, 3) },
    { id: 'hidden-triple', name: 'Hidden Triple', tier: 4, find: s => findHiddenSubset(s, 3) },
    { id: 'x-wing', name: 'X-Wing', tier: 5, find: s => findFish(s, 2) },
    { id: 'xy-wing', name: 'XY-Wing', tier: 6, find: findXYWing },
    { id: 'swordfish', name: 'Swordfish', tier: 6, find: s => findFish(s, 3) }
  ];
  const BY_ID = {};
  for (const t of TECHNIQUES) BY_ID[t.id] = t;

  // The simplest move available right now.
  function nextMove(state, opts) {
    const max = (opts && opts.maxTier) || 99;
    for (const t of TECHNIQUES) {
      if (t.tier > max) continue;
      const m = t.find(state);
      if (m) { m.name = t.name; m.tier = t.tier; return m; }
    }
    return null;
  }

  // Every move of one specific technique available right now (for drill grading).
  function findAllOf(state, id) {
    const out = [];
    const work = cloneState(state);
    const t = BY_ID[id];
    if (!t) return out;
    // Re-run the detector, blanking out each find in turn, to enumerate variants.
    const seen = new Set();
    for (let guard = 0; guard < 40; guard++) {
      const m = t.find(work);
      if (!m) break;
      const key = m.cells.join(',') + '|' + m.digits.join(',');
      if (seen.has(key)) break;
      seen.add(key);
      m.name = t.name; m.tier = t.tier;
      out.push(m);
      // suppress this find so the next call surfaces a different one
      for (const e of m.eliminations) work.cands[e.cell] &= ~bit(e.digit);
      for (const p of m.placements) place(work, p.cell, p.digit);
      if (isBroken(work)) break;
    }
    return out;
  }

  // Solve as a human would; returns the move log or where it got stuck.
  function humanSolve(grid, opts) {
    const state = makeState(grid);
    const log = [];
    for (let guard = 0; guard < 400; guard++) {
      if (isSolved(state)) return { solved: true, log, state };
      const m = nextMove(state, opts);
      if (!m) return { solved: false, log, state };
      log.push(m);
      applyMove(state, m);
    }
    return { solved: false, log, state };
  }

  // Hardest technique required to finish the puzzle (null if unsolvable by logic).
  function gradePuzzle(grid) {
    const r = humanSolve(grid);
    if (!r.solved) return { solvable: false, hardest: null, counts: {} };
    let hardest = TECHNIQUES[0], counts = {};
    for (const m of r.log) {
      counts[m.id] = (counts[m.id] || 0) + 1;
      if (BY_ID[m.id].tier > hardest.tier) hardest = BY_ID[m.id];
    }
    return { solvable: true, hardest: hardest.id, tier: hardest.tier, counts, steps: r.log.length };
  }

  // ---------------------------------------------------------- generation

  // Deterministic PRNG so a given seed always yields the same puzzle. This is
  // what lets both phones compute the identical Challenge of the Day offline.
  function rng(seed) {
    let s = seed >>> 0 || 1;
    return function () {
      s ^= s << 13; s >>>= 0;
      s ^= s >> 17;
      s ^= s << 5; s >>>= 0;
      return s / 4294967296;
    };
  }
  function shuffle(arr, rand) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = (rand() * (i + 1)) | 0;
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function fullGrid(rand) {
    const g = new Int8Array(81);
    (function rec(pos) {
      if (pos === 81) return true;
      let m = ALL;
      for (const p of PEERS[pos]) if (g[p]) m &= ~bit(g[p]);
      for (const d of shuffle(digitsOf(m), rand)) {
        g[pos] = d;
        if (rec(pos + 1)) return true;
        g[pos] = 0;
      }
      return false;
    })(0);
    return g;
  }

  // Dig holes while keeping the solution unique.
  function digPuzzle(solution, rand, keepMin) {
    const g = Int8Array.from(solution);
    const order = shuffle(Array.from({ length: 81 }, (_, i) => i), rand);
    let filled = 81;
    for (const c of order) {
      if (filled <= (keepMin || 22)) break;
      const saved = g[c];
      g[c] = 0;
      if (countSolutions(g, 2) !== 1) g[c] = saved;
      else filled--;
    }
    return g;
  }

  function generate(seed, keepMin) {
    const rand = rng(seed);
    const sol = fullGrid(rand);
    return { puzzle: digPuzzle(sol, rand, keepMin), solution: sol };
  }

  // ------------------------------------------------------------------ export

  return {
    ROWS, COLS, BOXES, UNITS, PEERS, ALL,
    rowOf, colOf, boxOf, unitsOf, UNIT_KIND, UNIT_NO,
    bit, popcount, digitsOf, lowestDigit,
    cellName, cellNames, unitName, parse, toStr,
    computeCands, makeState, cloneState, place, applyMove, isSolved, isBroken,
    solve, countSolutions, hasUniqueSolution,
    TECHNIQUES, BY_ID, nextMove, findAllOf, humanSolve, gradePuzzle,
    combinations, rng, shuffle, fullGrid, digPuzzle, generate
  };

            '🎯 <strong>Digit by digit, never cell by cell.</strong> Pick 1, sweep the nine rows, note which have exactly two spots. Fewer than two rows qualify? NEXT digit, immediately.',
            '📊 <strong>Start with the most-placed digit.</strong> More copies = more rows squeezed to two spots.',
            '✌️ <strong>Say "exactly two" out loud while scanning.</strong> Sounds silly. Stops the drift. Works.',

    'xy-wing': {
      icon: '🔀', alias: 'either way, one of them lights up',
      tagline: 'Three 2-note cells. However the middle one falls, a wing gets forced.',
      tell: 'A 2-note cell that sees two other 2-note cells, digits chained together.',
      when: 'When everything else including X-Wing came up empty.',
      body: [
        { h: 'The shape' },
        { p: '🎛️ Three cells, each with <strong>exactly two</strong> notes. One is the <em>pivot</em>, and it must see both of the others (same row, column or box... can be a different one for each wing).' },
        {
          ul: [
            '🎛️ Pivot: <code>{X, Y}</code>',
            '🪽 Wing one: <code>{X, Z}</code>',
            '🪽 Wing two: <code>{Y, Z}</code>'
          ]
        },
        { h: 'The logic, in two sentences' },
        { p: '➡️ If the pivot is X, wing one can\'t be X, so wing one becomes Z. If the pivot is Y, wing two can\'t be Y, so wing two becomes Z.' },
        { callout: '💡 <b>Either way, SOMEBODY is a Z.</b> You never find out who. Doesn\'t matter! Any cell that can see BOTH wings is staring at a guaranteed Z... so it can\'t be one. Erase.' },

        { h: 'The metaphor' },
        { p: '🚨 A light switch wired to two lamps: flip it one way, lamp one glows. Other way, lamp two. You haven\'t touched the switch, so you don\'t know which lamp is on. But <strong>one of them is</strong>. Any spot in the room that both lamps shine on? Definitely lit.' },

        {
          ol: [
            '✂️ Ignore every cell that isn\'t exactly 2 notes. The board shrinks to a handful.',

            '🔗 You want two of them that each share one digit with the pivot (a different one each) and share a third digit with each other.',
            '🎯 Found it? Now find the cells that see BOTH wings. Those are your erasures, often in a box neither wing lives in.'
          ]
        },
        { p: '🤹 Looks fiddly written down, feels natural on a board fast. The drills will put it in your hands quicker than any paragraph can.' }

    },

    'swordfish': {
      icon: '🐟', alias: 'X-Wing with three lines',
      tagline: 'Three rows, one digit, all spots inside the same three columns.',
      tell: 'Three rows with 2-3 spots for a digit, all landing in the same 3 columns.',
      when: 'Genuinely last resort. Triple-check X-Wing first.',
      body: [
        { h: 'The idea' },
        { p: '🐟 The X-Wing, plus one. Three rows where your digit has two or three spots each, and every spot falls inside the same three columns. Those rows will feed the digit to all three columns... so erase it from everywhere else in them.' },
      { svg: 'sword' },
        { callout: '⚠️ <b>The classic mistake:</b> the rows do NOT each need all three columns! Row A uses columns 2 and 5. Row B: 5 and 8. Row C: 2 and 8. Three rows, three columns total = valid swordfish. Demanding 3 spots per row makes you miss most of them.' },
        { h: 'Should you even learn this?' },
        { p: '😅 Honest answer: learn to <em>recognize</em> it, don\'t learn to <em>hunt</em> it. Swordfish are rare enough that two minutes of scanning is usually worse than two minutes of re-checking your notes for a typo.' },
        { p: '🎓 Its real value: when a hint reveals one, you nod and say "swordfish" instead of feeling like the app cheated. Also works sideways (columns → rows), exactly like the X-Wing.' }
      ]
    }
  };

  // Assemble full lesson objects from the engine's technique list at load time.
  function build(techniques) {
    const out = { notes: NOTES, ladder: LADDER };
    for (const t of techniques) {
      const c = T[t.id];
      if (!c) continue;
      out[t.id] = Object.assign({ id: t.id, name: t.name, kind: 'technique', tier: t.tier }, c);
    }
    return out;
  }

  return { build, TIERS, CONCEPTS: ['notes', 'ladder'] };
});

<script>
/*
 * Sudoku Lab - trainer UI.
 *
 * Depends on: Sudoku (engine.js), Lessons (lessons.js), Spec (spec.js), window.__DATA__.
 *
 * Every drill position was harvested by solving real puzzles with the same
 * engine that runs in here, always taking the simplest available move. So when
 * a drill says "this position needs an X-Wing", nothing easier exists on that
 * board. The grader recomputes the valid answers live with S.findAllOf(), which
 * keeps marking in lockstep with generation and lets a player who spots a
 * different-but-equally-valid instance of the technique still get credit.
 */
(function () {
  'use strict';

  const S = window.Sudoku;
  const DATA = window.__DATA__;
  const L = window.Lessons;
  const LESSONS = L.build(S.TECHNIQUES);
  const TECHS = S.TECHNIQUES.filter(t => LESSONS[t.id]);

  const $ = sel => document.querySelector(sel);
  const el = (tag, cls, html) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  };
  const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');

  // Answer specs + digit helpers live in spec.js so the offline test suite
  // grades drills by exactly the rules the UI enforces.
  const SPEC = window.Spec.SPEC;
  const primaryDigit = window.Spec.primaryDigit;
  const answerDigits = window.Spec.answerDigits;

  // ---------------------------------------------------------------- storage

  const KEY = 'sudoku-lab-v1';
  let P = load();

  function blank() {
    return { name: '', lessons: {}, tech: {}, daily: {}, play: {}, streakDays: 0, lastDay: '', total: 0 };
  }
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return blank();
      return Object.assign(blank(), JSON.parse(raw));
    } catch (e) { return blank(); }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) { /* private mode */ }
  }
  function techStat(id) {
    if (!P.tech[id]) P.tech[id] = { seen: 0, right: 0, firstTry: 0, streak: 0, best: 0 };
    return P.tech[id];
  }
  const MASTER_AT = 8;
  const learnedTechs = () => TECHS.filter(t => P.lessons[t.id] || techStat(t.id).seen > 0);
  const isMastered = id => techStat(id).firstTry >= MASTER_AT;

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function touchDay() {
    const t = todayStr();
    if (P.lastDay === t) return;
    const y = new Date(Date.now() - 864e5);
    const yStr = y.getFullYear() + '-' + String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0');
    P.streakDays = (P.lastDay === yStr) ? (P.streakDays || 0) + 1 : 1;
    P.lastDay = t;
    save();
  }

  // ------------------------------------------------------------- drill state

  function decodeCands(str) {
    const c = new Int16Array(81);
    for (let i = 0; i < 81; i++) c[i] = parseInt(str.substr(i * 2, 2), 32) || 0;
    return c;
  }
  function drillState(d) {
    return { grid: S.parse(d.g), cands: decodeCands(d.c) };
  }
  // All valid instances of this technique in this position, with full prose.
  function validMoves(d) {
    if (d._valid) return d._valid;
    const moves = S.findAllOf(drillState(d), d.t).map(m => ({
      cells: m.cells.slice(), digits: m.digits.slice(),
      place: m.placements.map(p => [p.cell, p.digit]),
      elim: m.eliminations.map(e => [e.cell, e.digit]),
      units: m.units.slice(), extra: (m.extra || []).slice(), note: m.note
    }));
    // The harvested featured move must always be offered first.
    const key = m => m.cells.join(',') + '|' + m.digits.join(',');
    const featured = d.m;
    const rest = moves.filter(m => key(m) !== key(featured));
    d._valid = [Object.assign({}, featured)].concat(rest);
    return d._valid;
  }

  // ------------------------------------------------------------------ grading

  const setEq = (a, b) => a.size === b.size && [...a].every(v => b.has(v));
  const isSub = (a, b) => [...a].every(v => b.has(v));

  function grade(d, selCells, selDigits) {
    const spec = SPEC[d.t];
    const moves = validMoves(d);

    for (const m of moves) {
      const wc = new Set(m.cells), wd = new Set(answerDigits(m, spec));
      if (setEq(selCells, wc) && setEq(selDigits, wd)) return { ok: true, move: m };
    }
    // Cells right, digits wrong (or vice versa) is worth saying out loud.
    for (const m of moves) {
      const wc = new Set(m.cells), wd = new Set(answerDigits(m, spec));
      if (setEq(selCells, wc)) {
        return { ok: false, kind: 'digit', move: m,
          msg: `The cells are exactly right. The digits are not: this one is about <b>${[...wd].join(' and ')}</b>, not ${[...selDigits].join(' and ') || 'nothing selected'}.` };
      }
      if (selDigits.size && setEq(selDigits, wd) && isSub(selCells, wc)) {
        return { ok: false, kind: 'partial', move: m,
          msg: `Right digit, right track. You have ${selCells.size} of the ${wc.size} ${spec.word}. Keep looking, the rest are on the board.` };
      }
    }
    // Strict subset of some valid pattern = partial credit.
    for (const m of moves) {
      const wc = new Set(m.cells), wd = new Set(answerDigits(m, spec));
      if (selCells.size && isSub(selCells, wc) && isSub(selDigits, wd)) {
        return { ok: false, kind: 'partial', move: m,
          msg: `Good start. Every cell you picked belongs to a real ${LESSONS[d.t].name}, you just have ${selCells.size} of ${wc.size}.` };
      }
    }
    return { ok: false, kind: 'wrong', msg: whyNot(d, selCells, selDigits) };
  }

  // Technique-specific "why that cell does not work". This is the part that
  // teaches: a bare "wrong" tells you nothing about what to look at next.
  function whyNot(d, selCells, selDigits) {
    const st = drillState(d);
    const spec = SPEC[d.t];
    const digits = [...selDigits];
    const cells = [...selCells];

    if (!cells.length) return 'Nothing selected yet. Tap the cells that make the pattern, then check again.';
    if (!digits.length && spec.digits) return 'Pick the digit (or digits) this pattern is about, then check again.';

    const cand = c => S.digitsOf(st.cands[c]);
    const nm = S.cellName;
    const spotsIn = (u, dg) => S.UNITS[u].filter(c => !st.grid[c] && (st.cands[c] & S.bit(dg))).length;

    // A filled cell is never part of any pattern.
    for (const c of cells) {
      if (st.grid[c]) return `${nm(c)} already has a ${st.grid[c]} in it. Every technique works on <em>empty</em> cells.`;
    }

    const d0 = digits[0];

    switch (d.t) {
      case 'naked-single': {
        const c = cells[0], n = cand(c).length;
        return `${nm(c)} still has ${plural(n, 'candidate')} (${cand(c).join(', ')}). A naked single needs a cell down to exactly one.`;
      }
      case 'hidden-single': {
        const c = cells[0];
        if (!(st.cands[c] & S.bit(d0)))
          return `${d0} cannot go in ${nm(c)} at all, something in its row, column or box already blocks it. Pick a cell where ${d0} is still a live candidate.`;
        const us = S.unitsOf(c).map(u => `${S.unitName(u)} has ${spotsIn(u, d0)}`);
        return `${d0} does fit in ${nm(c)}, but it is not the only home: ${us.join(', ')}. A hidden single needs a unit where ${d0} has exactly <b>one</b> spot left.`;
      }
      case 'naked-pair': case 'naked-triple': {
        const size = spec.cells[0];
        const fat = cells.find(c => cand(c).length > size);
        if (fat) return `${nm(fat)} has ${plural(cand(fat).length, 'candidate')} (${cand(fat).join(', ')}). In a naked ${size === 2 ? 'pair' : 'triple'} no cell may hold more than ${size}.`;
        let union = 0; for (const c of cells) union |= st.cands[c];
        const un = S.digitsOf(union);
        if (cells.length === size && un.length !== size)
          return `Those ${size} cells cover ${plural(un.length, 'digit')} between them (${un.join(', ')}). A naked ${size === 2 ? 'pair' : 'triple'} needs exactly ${size}.`;
        const units = new Set(); for (const u of S.unitsOf(cells[0])) units.add(u);
        const shared = cells.every(c => S.unitsOf(c).some(u => units.has(u)));
        if (!shared) return `Those cells do not all share a row, column or box. A naked ${size === 2 ? 'pair' : 'triple'} only works inside one unit.`;
        return `Those cells do not lock ${size} digits between them. Look for cells with exactly 2 candidates first, then check for a partner in the same unit.`;
      }
      case 'hidden-pair': case 'hidden-triple': {
        const size = spec.cells[0];
        const bad = digits.find(dg => !S.UNITS.some((_, u) => spotsIn(u, dg) >= 2 && spotsIn(u, dg) <= size
          && S.UNITS[u].some(c => cells.includes(c))));
        if (bad != null)
          return `Digit ${bad} does not have its homes squeezed into ${size} cells in any unit touching your selection. Count the spots per digit first, then look for ${size} digits sharing the same ${size} spots.`;
        return `Those digits are not confined to exactly those ${size} cells. In a hidden ${size === 2 ? 'pair' : 'triple'}, <em>every</em> spot for each chosen digit must land inside the cells you picked.`;
      }
      case 'pointing': {
        const b = S.boxOf(cells[0]);
        if (!cells.every(c => S.boxOf(c) === b)) return 'Those cells are not all in the same box. A pointing pair starts inside one box.';
        const spots = S.BOXES[b].filter(c => !st.grid[c] && (st.cands[c] & S.bit(d0)));
        if (!spots.length) return `Box ${b + 1} has no cells left that can take a ${d0}.`;
        const sameRow = spots.every(c => S.rowOf(c) === S.rowOf(spots[0]));
        const sameCol = spots.every(c => S.colOf(c) === S.colOf(spots[0]));
        if (!sameRow && !sameCol)
          return `In box ${b + 1}, ${d0} can go in ${S.cellNames(spots)}. Those are not all on one row or one column, so the ${d0} is not locked to a line.`;
        return `You have the right idea but not every spot. In box ${b + 1}, ${d0} can go in ${S.cellNames(spots)}, and you need <em>all</em> of them selected.`;
      }
      case 'claiming': {
        const us = S.unitsOf(cells[0]).filter(u => u < 18 && cells.every(c => S.UNITS[u].includes(c)));
        if (!us.length) return 'Those cells do not all share a single row or column. Box-line reduction starts from one line.';
        const u = us[0];
        const spots = S.UNITS[u].filter(c => !st.grid[c] && (st.cands[c] & S.bit(d0)));
        const boxes = new Set(spots.map(S.boxOf));
        if (boxes.size > 1)
          return `On ${S.unitName(u)}, ${d0} can still go in ${S.cellNames(spots)}, which spans ${plural(boxes.size, 'box')}. Box-line reduction needs every spot on the line to sit in <em>one</em> box.`;
        return `Right idea, incomplete selection. On ${S.unitName(u)}, ${d0} can go in ${S.cellNames(spots)}. Select all of them.`;
      }
      case 'x-wing': case 'swordfish': {
        const need = d.t === 'x-wing' ? 2 : 3;
        const rows = new Set(cells.map(S.rowOf)), cols = new Set(cells.map(S.colOf));
        const dead = cells.find(c => !(st.cands[c] & S.bit(d0)));
        if (dead != null) return `${nm(dead)} cannot be a ${d0} at all, so it cannot be a corner. Every corner must have ${d0} as a live candidate.`;
        const byRow = [...rows].map(r => `row ${r + 1} has ${spotsIn(r, d0)}`);
        if (rows.size === need && [...rows].some(r => spotsIn(r, d0) > (d.t === 'x-wing' ? 2 : 3)))
          return `Check your spot counts: ${byRow.join(', ')} possible ${d0}s. An ${d.t === 'x-wing' ? 'X-Wing needs exactly 2' : 'a Swordfish needs 2 or 3'} in each base line.`;
        if (rows.size !== need && cols.size !== need)
          return `You have selected cells across ${plural(rows.size, 'row')} and ${plural(cols.size, 'column')}. ${d.t === 'x-wing' ? 'An X-Wing' : 'A Swordfish'} needs exactly ${need} base lines lining up on exactly ${need} cross-lines.`;
        return `Those corners do not line up. Pick a digit, find the ${need} lines where it has the fewest spots, then check whether they share the same ${need} cross-lines.`;
      }
      case 'xy-wing': {
        const fat = cells.find(c => cand(c).length !== 2);
        if (fat != null) return `${nm(fat)} has ${plural(cand(fat).length, 'candidate')} (${cand(fat).join(', ')}). Every one of the three cells in an XY-Wing has exactly 2.`;
        const [a, b, c] = cells;
        const sees = (x, y) => S.PEERS[x].includes(y);
        const pivot = [a, b, c].find(p => [a, b, c].filter(q => q !== p).every(q => sees(p, q)));
        if (pivot == null) return 'None of those three cells can see both of the others. One of them has to be the pivot, sharing a unit with each wing.';
        return `The candidate sets do not fit. The pivot needs {X,Y}, one wing {X,Z} and the other {Y,Z}, with Z shared by the wings but absent from the pivot.`;
      }
    }
    return 'Not this one. Use a hint if you want a nudge toward the right region.';
  }

  // -------------------------------------------------------------------- hints

  function hints(d, move) {
    const spec = SPEC[d.t];
    const ds = answerDigits(move, spec);
    const out = [];
    out.push(`The ${ds.length > 1 ? 'digits are' : 'digit is'} <b>${ds.join(' and ')}</b>${spec.digitLabel ? ' (' + spec.digitLabel + ')' : ''}.`);
    if (move.units && move.units.length) {
      const names = [...new Set(move.units)].map(S.unitName);
      out.push(`Look at <b>${names.slice(0, 3).join(', ')}</b>.`);
    } else {
      out.push(`Look for the cells with exactly two candidates, around <b>${S.cellName(move.cells[0])}</b>.`);
    }
    out.push(`It is <b>${S.cellNames(move.cells)}</b>. Now say why out loud before you tap check.`);
    return out;
  }

  // ------------------------------------------------------------------- board

  function renderBoard(v) {
    const b = el('div', 'board');
    const selSet = v.sel || new Set();
    const patSet = v.pattern || new Set();
    const unitCells = new Set();
    for (const u of (v.units || [])) for (const c of S.UNITS[u]) unitCells.add(c);
    const elimBy = {};
    for (const [c, dg] of (v.elim || [])) (elimBy[c] = elimBy[c] || []).push(dg);
    const blockers = new Set(v.blockers || []);
    const hi = new Set(v.hiDigits || []);

    for (let c = 0; c < 81; c++) {
      const r = S.rowOf(c), col = S.colOf(c);
      const cell = el('div', 'cell');
      if (r % 3 === 0 && r > 0) cell.classList.add('bt');
      if (col % 3 === 0 && col > 0) cell.classList.add('bl');

      if (unitCells.has(c)) cell.classList.add('unit');
      if (v.cursor === c) cell.classList.add('cursor');
      if (blockers.has(c)) cell.classList.add('blocker');
      if (elimBy[c]) cell.classList.add('elim');
      if (patSet.has(c)) cell.classList.add('pattern');
      if (selSet.has(c)) cell.classList.add('sel');
      if (v.peers && v.peers.has(c)) cell.classList.add('peer');
      if (v.sameDigit && v.sameDigit.has(c)) cell.classList.add('same');

      if (v.grid[c]) {
        cell.textContent = v.grid[c];
        cell.classList.add(v.given && v.given[c] !== '.' && v.given[c] !== '0' ? 'given' : 'placed');
        if (v.conflicts && v.conflicts.has(c)) cell.classList.add('conflict');
      } else if (v.pending && v.pending.cell === c) {
        // The number the player is about to commit, shown in the cell itself.
        cell.textContent = v.pending.digit;
        cell.classList.add('placed');
      } else if (v.showNotes !== false && v.cands) {
        const n = el('div', 'notes');
        for (let dg = 1; dg <= 9; dg++) {
          const i = el('i');
          if (v.cands[c] & S.bit(dg)) {
            i.textContent = dg;
            if (elimBy[c] && elimBy[c].includes(dg)) i.className = 'dead';
            else if (hi.has(dg) && (patSet.has(c) || selSet.has(c))) i.className = 'hi';
            else if (v.hiNote && dg === v.hiNote) i.className = 'hi';
          }
          n.appendChild(i);
        }
        cell.appendChild(n);
      }
      if (v.onTap) cell.addEventListener('click', () => v.onTap(c));
      b.appendChild(cell);
    }
    return b;
  }

  // ------------------------------------------------------------------ chrome

  const buzz = pattern => { try { navigator.vibrate && navigator.vibrate(pattern); } catch (e) { /* no-op */ } };

  let toastTimer = null;
  function toast(msg) {
    let t = $('#toast');
    if (!t) { t = el('div', 'toast'); t.id = 'toast'; document.body.appendChild(t); }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
  }

  function chrome(title, backTo) {
    const bar = el('div', 'topbar');
    const inn = el('div', 'topbar-in');
    if (backTo != null) {
      const b = el('button', 'back', '&#8249;');
      b.addEventListener('click', () => go(backTo));
      inn.appendChild(b);
    }
    inn.appendChild(el('h1', null, esc(title)));
    if (P.name) inn.appendChild(el('div', 'who', esc(P.name)));
    bar.appendChild(inn);
    return bar;
  }

  let lastScreenKey = null;
  function screen(title, backTo) {
    const root = $('#app');
    // A board tap re-renders the SAME screen: keep the scroll position and skip
    // the entry animation, so interaction feels in-place instead of a reload.
    const fresh = lastScreenKey !== current;
    const y = window.scrollY;
    lastScreenKey = current;
    root.innerHTML = '';
    if (title) root.appendChild(chrome(title, backTo));
    const w = el('div', 'wrap' + (fresh ? ' anim' : ''));
    root.appendChild(w);
    requestAnimationFrame(() => window.scrollTo(0, fresh ? 0 : y));
    return w;
  }

  function ring(pct, label) {
    const r = 17, circ = 2 * Math.PI * r;
    const wrap = el('div', 'ring');
    wrap.innerHTML = `<svg viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="${r}" fill="none" stroke="#2a3150" stroke-width="3.5"/>
      <circle cx="20" cy="20" r="${r}" fill="none" stroke="url(#g)" stroke-width="3.5"
        stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ * (1 - pct)}"/>
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7c6cff"/><stop offset="1" stop-color="#c084fc"/>
      </linearGradient></defs></svg><b>${label}</b>`;
    return wrap;
  }

        lines += `<path class="${w2}" d="M${i * cs} 0v${W}M0 ${i * cs}h${W}"/>`;
      }
      const spot = (r, c) => `<rect class="corner" x="${c * cs + 2}" y="${r * cs + 2}" width="${cs - 4}" height="${cs - 4}" rx="4"/>
        <text x="${c * cs + cs / 2}" y="${r * cs + cs / 2 + 6}" font-size="14" fill="#6d4df0" text-anchor="middle">4</text>`;
      const die = (r, c, d) => `<text class="dieX" style="animation-delay:${d}s" x="${c * cs + cs / 2}" y="${r * cs + cs / 2 + 5}" font-size="13" fill="#e02444" text-anchor="middle">✕</text>`;
      svg = `<svg viewBox="-4 -4 ${W + 8} ${W + 8}">
        <rect class="cellbg" x="0" y="0" width="${W}" height="${W}"/>
        ${lines}
        <rect class="gridbold" x="0" y="0" width="${W}" height="${W}" rx="6"/>
        <rect class="colbar" x="${1 * cs}" y="0" width="${cs}" height="${W}"/>
        <rect class="colbar" x="${4 * cs}" y="0" width="${cs}" height="${W}"/>
        <rect class="colbar" x="${7 * cs}" y="0" width="${cs}" height="${W}"/>
        ${spot(1, 1)}${spot(1, 4)}${spot(4, 4)}${spot(4, 7)}${spot(7, 1)}${spot(7, 7)}
        ${die(0, 4, 0)}${die(2, 7, .12)}${die(3, 1, .24)}${die(6, 4, .36)}${die(8, 7, .48)}
      </svg>`;
      cap = 'Three rows, three columns, tangled on purpose. The columns are claimed anyway. Same trick as X-Wing, bigger fish. 🐟';
    }

    if (kind === 'pair') {
      // Three cells in a row: the twins glow, their digits die in the neighbor.
      const note = (x, y, t, cls) => `<text class="${cls || ''}" x="${x}" y="${y}" font-size="17" fill="${cls ? '#6d4df0' : '#8c86a6'}" text-anchor="middle">${t}</text>`;
      svg = `<svg viewBox="-4 -4 268 96">
        <rect class="cellbg" x="0" y="0" width="260" height="88"/>
        <rect class="twin" x="2" y="2" width="82" height="84" rx="6"/>
        <rect class="twin" x="89" y="2" width="82" height="84" rx="6"/>
        <path class="gridline" d="M86.5 0v88M173.5 0v88"/>
        <rect class="gridbold" x="0" y="0" width="260" height="88" rx="8"/>
        ${note(30, 38, '4', 'hi')}${note(56, 38, '7', 'hi')}
        ${note(117, 38, '4', 'hi')}${note(143, 38, '7', 'hi')}
        ${note(195, 30, '2')}${note(217, 30, '4')}${note(239, 30, '7')}${note(217, 70, '9')}
        <line class="strike" x1="209" y1="24" x2="226" y2="30"/>
        <line class="strike" x1="231" y1="24" x2="248" y2="30" style="animation-delay:.15s"/>
      </svg>`;
      cap = 'The twins own 4 and 7 between them, so the neighbor loses both. Nobody ever finds out which twin is which. 👯';
    }

    wrap.innerHTML = svg + `<div class="cap">${cap}</div>`;
    return wrap;
  }

  // ======================================================================
  //  SCREENS
  // ======================================================================

  const routes = {};
  let current = 'home';

  // Hash routing, so the Android back button and iOS back-swipe both work once
  // the app is installed to a home screen, and so a screen can be linked to.
  function go(hash) {
    if ((location.hash.slice(1) || 'home') !== hash) { location.hash = hash; return; }
    render(hash);
  }
  function render(hash) {
    current = hash || 'home';
    const i = current.indexOf(':');
    const name = i < 0 ? current : current.slice(0, i);
    const arg = i < 0 ? undefined : current.slice(i + 1);
    (routes[name] || routes.home)(arg);
  }
  window.addEventListener('hashchange', () => render(location.hash.slice(1) || 'home'));

  // ---------------------------------------------------------------- home

  // The one thing to do next: concepts first, then the ladder in order.
  function nextStep() {
    if (!P.lessons.ladder) return { href: 'lesson:ladder', label: 'When to use what', why: 'The 2-minute map. Which technique, in which order, every time you stall.' };
    if (!P.lessons.notes) return { href: 'lesson:notes', label: 'Notes, properly', why: 'The unlock for everything below. Two minutes, big payoff.' };
    const t = TECHS.find(x => !isMastered(x.id));
    if (t) return { href: 'lesson:' + t.id, label: t.name, why: LESSONS[t.id].alias };
    return { href: 'spotcheck', label: 'Spot Check', why: 'Everything mastered. Go flex.' };
  }

  function conceptRow(l) {
    const done = !!P.lessons[l.id];
    const row = el('button', 'trow' + (done ? ' done' : ''));
    row.innerHTML = `<div class="ring" style="font-size:21px">${l.icon}</div>
      <div class="body"><div class="nm">${esc(l.name)}</div>
      <div class="sb">${esc(l.tagline)}</div></div>
      <div class="chev">${done ? '✅' : '&#8250;'}</div>`;
    row.addEventListener('click', () => go('lesson:' + l.id));
    return row;
  }

  routes.home = function () {
    touchDay();
    const w = screen(null);
    const hero = el('div', 'hero');

    if (!P.name) {
      const c = el('div', 'card');

    // One obvious next action, so a first visit never has to guess where to go.

    up.appendChild(ub);
    w.appendChild(up);

    if (P.play && P.play.grid) {

    tiles.appendChild(tile('📅', 'Daily Challenge', 'Same puzzle on both phones.', 'daily'));
    tiles.appendChild(tile('🚗', 'Solve My Board', 'Stuck in Easy Brain or the Tesla? Type your board in, get coached through the next moves.', 'entry', true));
    tiles.appendChild(tile('🤝', 'Pass & Play', 'Two of you, one phone.', 'versus', true));
    play.appendChild(tiles);

    // Spot Check lives BELOW the ladder on purpose: it is the graduation game.

      locked ? 'Learn any 3 techniques above to unlock. No labels, just a board.'
        : 'No labels, just a board. Name the cheapest technique that cracks it, then find it.',
      'spotcheck', true);

    w.appendChild(boss);

    const mastered = TECHS.filter(t => isMastered(t.id)).length;
    const stats = el('div', 'statrow');
    stats.style.marginTop = '26px';
    stats.innerHTML = `
      <div class="stat"><div class="n">${mastered}/${TECHS.length}</div><div class="l">techniques</div></div>
      <div class="stat"><div class="n">${P.total || 0}</div><div class="l">drills solved</div></div>
      <div class="stat"><div class="n">${P.streakDays || 0}</div><div class="l">day streak</div></div>`;
    w.appendChild(stats);

    const foot = el('div', 'foot');
    foot.innerHTML = `${DATA.drills[TECHS[0].id].length} drills per technique, harvested from ${DATA.seedsRun.toLocaleString()} generated puzzles.<br>
      Progress lives on this device only. <a href="#" id="reset">Reset</a>`;
    w.appendChild(foot);
    foot.querySelector('#reset').addEventListener('click', e => {
      e.preventDefault();
      if (confirm('Wipe all progress on this phone?')) { P = blank(); save(); go('home'); }
    });
  };

  function tile(ic, t, d, href, wide) {
    const b = el('button', 'tile' + (wide ? ' wide' : ''));
    b.innerHTML = `<div class="ic">${ic}</div><div class="t">${esc(t)}</div><div class="d">${esc(d)}</div>`;
    b.addEventListener('click', () => go(href));

  }

  function techRow(t) {
    const st = techStat(t.id);

    const done = isMastered(t.id);
    const row = el('button', 'trow' + (done ? ' done' : ''));
    row.appendChild(ring(pct, done ? '★' : String(st.firstTry)));
    const body = el('div', 'body');

    body.innerHTML = `<div class="nm">${lesson.icon} ${esc(t.name)}</div>
      <div class="al">${esc(lesson.alias)}</div>
      <div class="sb">${esc(lesson.tagline)}</div>`;
    row.appendChild(body);
    row.appendChild(el('div', 'chev', '&#8250;'));
    row.addEventListener('click', () => go('lesson:' + t.id));

  }

  // -------------------------------------------------------------- lesson

    const head = el('div', 'card');

      <div style="font-weight:800;font-size:20px;margin-top:4px">${esc(l.name)}</div>
      <div style="color:var(--accent2);font-weight:600;font-size:13.5px">${esc(l.alias)}</div>
      <div class="muted" style="margin-top:8px;font-size:15px">${esc(l.tagline)}</div>`;

      else if (blk.ul) body.appendChild(el('ul', null, blk.ul.map(x => `<li>${x}</li>`).join('')));
      else if (blk.ol) body.appendChild(el('ol', null, blk.ol.map(x => `<li>${x}</li>`).join('')));

    if (l.kind === 'technique') {

      }));

        <span class="chip">Shaded = the units involved</span>
        ${m.elim.length ? '<span class="chip">Red = candidates it kills</span>' : ''}`;
      worked.appendChild(legend);
      worked.appendChild(el('div', 'callout', m.note));

      const tips = el('div', 'card');

        <p class="meta-note" style="margin:0 0 12px">${esc(l.tell)}</p>
        <h4 style="margin:0 0 6px;font-size:15px">When to reach for it</h4>

    } else {
