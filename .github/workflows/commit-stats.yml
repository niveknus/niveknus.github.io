name: Update Commit Stats

on:
  schedule:
    - cron: '0 6 * * *'   # 6 AM UTC = ~1 AM CT daily
  push:
    branches: [main]
  workflow_dispatch:        # allow manual trigger

permissions:
  contents: write

# Serialize runs so two concurrent runs don't race each other on push.
# This only serializes THIS workflow — other workflows (e.g. report deploys)
# still push to main independently, which is what the retry below handles.
concurrency:
  group: commit-stats
  cancel-in-progress: false

jobs:
  build-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate commit data
        env:
          GH_TOKEN: ${{ secrets.STATS_PAT }}
        run: python3 scripts/generate-commit-stats.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # commit-data.json is regenerated wholesale from upstream state, so it is
          # never meaningfully merged. On a push race the correct move is to re-apply
          # our freshly generated copy on top of the latest main; rebasing just yields
          # a guaranteed content conflict in a generated file.
          cp commit-data.json "$RUNNER_TEMP/commit-data.json"

          for attempt in 1 2 3 4 5; do
            if git diff --quiet -- commit-data.json \
               && git diff --staged --quiet -- commit-data.json; then
              echo "No changes to commit (attempt $attempt) — stats already up to date."
              exit 0
            fi

            git add commit-data.json
            git commit -m "chore: update commit stats [skip ci]"

            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi

            echo "Push rejected (attempt $attempt) — resetting onto origin/main and re-applying."
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/commit-data.json" commit-data.json
          done

          echo "::error::Failed to push commit stats after 5 attempts."
          exit 1
